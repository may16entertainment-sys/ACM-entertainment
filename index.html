<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Entertainment scheduling tool for the Amman Christmas Market, 25 November – 13 December 2026.">
<title>Amman Christmas Market — Entertainment Scheduler</title>
<style>
/* ==========================================================================
   Amman Christmas Market — Entertainment Scheduler
   Styles. Logical properties (inline-start/end) are used throughout so the
   layout mirrors correctly in Arabic (RTL) without separate stylesheets.
   ========================================================================== */
:root{
  --green-950:#0f2a20; --green-900:#14372a; --green-800:#1a4735; --green-700:#1f5c43; --green-100:#e3eee8;
  --burg-800:#5e1621; --burg-700:#7a1f2b; --burg-600:#93283a; --burg-100:#f6e3e5;
  --cream:#f8f3e7; --cream-2:#efe6d2; --cream-3:#e4d8bd;
  --gold:#b8913a; --gold-600:#9a7628; --gold-100:#f5ecd6;
  --ink:#1d2321; --ink-2:#47504c; --ink-3:#6b746f; --line:#d9d4c7; --line-2:#ebe7dc;
  --paper:#ffffff; --bg:#f4f1ea; --surface:#fbfaf6;
  --danger:#b3261e; --danger-bg:#fde7e5; --warn:#8a5a00; --warn-bg:#fff2d6; --info:#245a8f; --info-bg:#e5f0fa; --ok:#1f6b3f; --ok-bg:#e1f2e6;
  --closed-hatch:repeating-linear-gradient(45deg,#e9e6de 0 6px,#f3f1eb 6px 12px);
  --radius:8px; --radius-sm:5px;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 4px 14px rgba(20,30,25,.08);
  --shadow-lg:0 10px 40px rgba(10,20,15,.25);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --font-ar:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,sans-serif;
  --label-w:190px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.4;color:var(--ink);background:var(--bg);min-height:100vh}
html[lang="ar"] body{font-family:var(--font-ar);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-700)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
bdi.t{unicode-bidi:isolate;white-space:nowrap}

/* ---------- Top bar ---------- */
.topbar{background:linear-gradient(180deg,var(--green-900),var(--green-950));color:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 0 var(--gold)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text strong{font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand-text span{font-size:11.5px;color:#d9cfa9;white-space:nowrap}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-inline-start:8px}
.nav button{background:transparent;border:0;color:#e9efe9;padding:8px 11px;border-radius:6px;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button[aria-current="page"]{background:var(--cream);color:var(--green-900)}
.nav .count{background:var(--burg-700);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.nav button[aria-current="page"] .count{background:var(--burg-700)}
.topbar-end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.save-status{font-size:12px;padding:4px 9px;border-radius:12px;background:rgba(255,255,255,.1);white-space:nowrap;display:flex;gap:6px;align-items:center}
.save-status .dot{width:8px;height:8px;border-radius:50%;background:#7fd19b}
.save-status.dirty .dot{background:#f2c14e}
.save-status.error{background:var(--danger)}
.save-status.error .dot{background:#fff}
.lang-switch{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden}
.lang-switch button{background:transparent;border:0;color:#fff;padding:5px 10px;cursor:pointer;font-size:13px}
.lang-switch button[aria-pressed="true"]{background:var(--gold);color:var(--green-950);font-weight:700}

/* ---------- Toolbar ---------- */
.toolbar{background:var(--cream);border-bottom:1px solid var(--cream-3);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;position:sticky;top:50px;z-index:40}
.tool-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool-group label.inline{font-size:12px;color:var(--ink-2)}
.datebox{display:flex;align-items:center;gap:4px}
.datebox input[type=date]{padding:5px 6px}
.datebox .day-label{font-weight:600;min-width:9em;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{max-width:150px}
.filters input[type=search]{max-width:190px}
.filter-active{background:var(--gold-100)!important;border-color:var(--gold)!important}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--green-700);border-color:var(--green-700);color:#fff}
.btn.primary:hover{background:var(--green-800)}
.btn.burg{background:var(--burg-700);border-color:var(--burg-700);color:#fff}
.btn.burg:hover{background:var(--burg-800)}
.btn.danger{color:var(--danger);border-color:#e7b7b3}
.btn.danger:hover{background:var(--danger-bg)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.icon{padding:5px 8px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],input[type=color],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-height:32px}
input[type=color]{padding:2px;width:42px}
textarea{min-height:60px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green-700);outline:2px solid rgba(31,92,67,.25);outline-offset:0}
input[aria-invalid="true"]{border-color:var(--danger);background:var(--danger-bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green-700);color:#fff}

/* ---------- Layout ---------- */
main{padding:14px 16px 40px;max-width:100%}
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.view-head h1{font-size:20px;margin:0;color:var(--green-900)}
.view-head h1 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-inline-start:6px}
.view-head .spacer{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card-h{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:15px;color:var(--green-900)}
.card-b{padding:12px 14px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.grid{display:grid;gap:12px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--radius);margin-bottom:10px;border:1px solid}
.banner.info{background:var(--info-bg);border-color:#bcd5ee;color:#163f66}
.banner.warn{background:var(--warn-bg);border-color:#efd59b;color:#5f3e00}
.banner.danger{background:var(--danger-bg);border-color:#efb8b3;color:#7a1712}
.banner.demo{background:var(--gold-100);border-color:var(--gold);color:#4f3c10}
.banner .grow{flex:1}

/* ---------- Badges / tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.tag.demo{background:#fff4cc;color:#6b4e00;border-color:#e2c46a}
.tag.special{background:var(--gold-100);color:#6b4e00;border-color:var(--gold)}
.tag.closed{background:#ececec;color:#444;border-color:#cfcfcf}
.tag.override{background:var(--info-bg);color:var(--info);border-color:#bcd5ee}
.tag.st-proposed{background:#f1eefb;color:#4b3b8f;border-color:#d4ccf1}
.tag.st-tentative{background:var(--warn-bg);color:var(--warn);border-color:#efd59b}
.tag.st-confirmed{background:var(--ok-bg);color:var(--ok);border-color:#b7dcc3}
.tag.st-completed{background:#e6eef0;color:#2d5560;border-color:#c4d6db}
.tag.st-cancelled{background:#eee;color:#555;border-color:#ccc;text-decoration:line-through}
.tag.sev-high{background:var(--danger-bg);color:var(--danger);border-color:#efb8b3}
.tag.sev-medium{background:var(--warn-bg);color:var(--warn);border-color:#efd59b}
.tag.sev-low{background:var(--info-bg);color:var(--info);border-color:#bcd5ee}
.tag.ack{background:var(--ok-bg);color:var(--ok);border-color:#b7dcc3}
.tag.type-stage{background:var(--green-100);color:var(--green-800);border-color:#bcd6c8}
.tag.type-roaming{background:var(--burg-100);color:var(--burg-700);border-color:#e7c0c5}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:middle;flex:none}
.warn-icon{color:var(--danger);font-weight:700}

/* ---------- Legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);align-items:center;padding:6px 0}
.legend .li{display:inline-flex;align-items:center;gap:5px}
.legend .shape{display:inline-block;width:22px;height:12px;border-radius:3px;border:1.5px solid var(--ink-3);background:#fff}
.legend .shape.roam{border-style:dashed;background:repeating-linear-gradient(135deg,#fff 0 4px,#f1ece3 4px 8px)}
.legend .shape.closed{background:var(--closed-hatch);border-color:#ccc}
.legend .shape.open{background:#fffdf7;border-color:#e2dccb}
.legend .shape.special{background:rgba(184,145,58,.35);border-color:var(--gold)}
.legend-title{font-weight:700;color:var(--ink)}

/* ---------- Event block (shared look) ---------- */
.evb{--c:#777;position:absolute;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,#fff);border:1px solid color-mix(in srgb,var(--c) 55%,#fff);border-inline-start:4px solid var(--c);color:var(--ink);overflow:hidden;cursor:grab;padding:2px 6px;font-size:12px;line-height:1.25;text-align:start;box-shadow:0 1px 1px rgba(0,0,0,.06);touch-action:none;user-select:none}
.evb:hover{box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:5}
.evb:focus-visible{z-index:6}
.evb.roaming{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,#fff) 0 7px,color-mix(in srgb,var(--c) 9%,#fff) 7px 14px);border-style:dashed;border-inline-start-style:solid}
.evb.st-proposed{border-style:dotted;border-inline-start-style:solid}
.evb.st-cancelled{opacity:.5;text-decoration:line-through;filter:grayscale(.7)}
.evb.has-conflict{box-shadow:0 0 0 2px var(--danger) inset}
.evb.has-conflict.ack-only{box-shadow:0 0 0 2px var(--ok) inset}
.evb.dragging{opacity:.85;cursor:grabbing;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.evb.ghost{cursor:pointer;opacity:.75;border-style:dashed;border-inline-start-width:2px}
.evb .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.evb .t2,.evb .t3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.evb .t3{font-size:11px}
.evb .ic{font-size:11px;flex:none}
.evb .cf{color:var(--danger);font-weight:800;flex:none}
.evb .ack-mark{color:var(--ok);font-weight:800;flex:none}
.evb .demo-mini{font-size:9.5px;font-weight:800;color:#6b4e00;background:#fff4cc;border:1px solid #e2c46a;border-radius:3px;padding:0 3px;flex:none}
.evb .handle{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.evb .handle.h-start{inset-inline-start:-2px}
.evb .handle.h-end{inset-inline-end:0}
.evb .handle:hover{background:rgba(0,0,0,.12)}
.drag-tip{position:fixed;z-index:200;background:var(--green-950);color:#fff;padding:4px 8px;border-radius:5px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}

/* ---------- Daily timeline ---------- */
.tl-head-info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.day-title{font-size:20px;font-weight:700;color:var(--green-900);margin:0}
.hours-chip{background:var(--green-100);color:var(--green-900);border:1px solid #bcd6c8;border-radius:16px;padding:3px 10px;font-weight:600;font-size:13px}
.hours-chip.closed{background:#eee;color:#555;border-color:#ccc}
.tl-wrap{position:relative;overflow:auto;max-height:calc(100vh - 250px);min-height:240px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.tl-grid{position:relative;min-width:100%}
.tl-head{display:flex;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;inset-inline-start:0;z-index:22;width:var(--label-w);flex:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:6px 10px;font-size:12px;color:var(--ink-3);display:flex;align-items:flex-end}
.tl-axis{position:relative;height:46px;flex:none}
.tl-hour{position:absolute;top:0;bottom:0;border-inline-start:1px solid #b9b3a3;padding-inline-start:4px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.tl-hour span{position:absolute;top:4px;inset-inline-start:4px}
.tl-half{position:absolute;bottom:0;height:10px;border-inline-start:1px solid #d3cdbf}
.tl-axis .open-mark,.tl-axis .close-mark{position:absolute;bottom:2px;font-size:10.5px;font-weight:700;padding:0 4px;border-radius:3px;white-space:nowrap;transform:translateX(0)}
.tl-axis .open-mark{color:var(--green-800);background:var(--green-100)}
.tl-axis .close-mark{color:var(--burg-700);background:var(--burg-100)}
.tl-axis .special-band{position:absolute;top:22px;height:6px;background:rgba(184,145,58,.55);border-radius:3px}
.tl-group{display:flex;position:relative;background:var(--cream);border-bottom:1px solid var(--cream-3)}
.tl-group .tl-label{background:var(--cream);font-weight:700;color:var(--green-900);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
html[lang="ar"] .tl-group .tl-label{text-transform:none;letter-spacing:0}
.tl-row{display:flex;position:relative;border-bottom:1px solid var(--line-2)}
.tl-label{position:sticky;inset-inline-start:0;z-index:10;width:var(--label-w);flex:none;background:var(--paper);border-inline-end:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;align-items:flex-start}
.tl-label .rl-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.tl-label .rl-sub{font-size:11px;color:var(--ink-3)}
.tl-label .collapse{border:0;background:transparent;cursor:pointer;padding:0 2px;font-size:12px;color:var(--ink-3);line-height:1.4;min-width:16px}
.tl-track{position:relative;flex:none;cursor:copy}
.tl-track .bg-open{position:absolute;top:0;bottom:0;background:#fffdf7}
.tl-track .bg-closed{position:absolute;top:0;bottom:0;background:var(--closed-hatch)}
.tl-track .bg-special{position:absolute;top:0;height:3px;background:rgba(184,145,58,.7)}
.tl-track .gl{position:absolute;top:0;bottom:0;border-inline-start:1px solid #e6e1d4;pointer-events:none}
.tl-track .gl.h{border-inline-start-color:#d6cfbf}
.tl-track .oc-line{position:absolute;top:0;bottom:0;border-inline-start:2px solid var(--green-700);pointer-events:none;z-index:1}
.tl-track .oc-line.close{border-inline-start-color:var(--burg-700)}
.tl-track .now-line{position:absolute;top:0;bottom:0;border-inline-start:2px solid #d22;z-index:4;pointer-events:none}
.tl-track .collapsed-info{position:absolute;inset-inline-start:8px;top:3px;font-size:11px;color:var(--ink-3)}
.tl-track .hover-slot{position:absolute;top:2px;bottom:2px;background:rgba(31,92,67,.10);border:1px dashed rgba(31,92,67,.5);border-radius:4px;pointer-events:none;display:none}
.tl-track:hover .hover-slot{display:block}
.tl-track.drop-target{background:rgba(184,145,58,.12)}
.tl-row.collapsed .tl-track{cursor:pointer}
.tl-empty{padding:30px;text-align:center;color:var(--ink-3)}

/* ---------- Month ---------- */
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line)}
.month-grid .dow{background:var(--green-900);color:#fff;font-weight:600;font-size:12px;padding:6px 8px;text-align:center}
.mcell{background:var(--paper);min-height:132px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;border:0;text-align:start;outline-offset:-3px}
.mcell.out-month{background:#f4f2ec;color:#9a9a92}
.mcell.out-market{background:#f7f6f2}
.mcell.out-market .mnum{color:#a5a59d}
.mcell.in-market{background:#fff}
.mcell.in-market::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gold)}
.mcell.is-selected{box-shadow:inset 0 0 0 2px var(--green-700)}
.mcell.is-today .mnum{background:var(--burg-700);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.mcell .mtop{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mcell .mnum{font-weight:700;font-size:14px}
.mcell .mhours{font-size:11px;color:var(--ink-2)}
.mcell .mstatus{font-size:10.5px;font-weight:700;border-radius:3px;padding:0 4px;margin-inline-start:auto}
.mstatus.none{background:var(--burg-100);color:var(--burg-700)}
.mstatus.partial{background:var(--warn-bg);color:var(--warn)}
.mstatus.complete{background:var(--ok-bg);color:var(--ok)}
.mstatus.scheduled{background:var(--info-bg);color:var(--info)}
.mev{display:flex;gap:4px;align-items:center;font-size:11.5px;border-radius:3px;padding:1px 4px;background:color-mix(in srgb,var(--c) 14%,#fff);border-inline-start:3px solid var(--c);cursor:pointer;border-top:0;border-bottom:0;border-inline-end:0;text-align:start;width:100%;min-width:0}
.mev.roaming{border-inline-start-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff) 0 5px,#fff 5px 10px)}
.mev.st-cancelled{opacity:.55;text-decoration:line-through}
.mev .mt{font-weight:700;flex:none}
.mev .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mev .mc{color:var(--ink-3);font-size:10.5px;white-space:nowrap;margin-inline-start:auto;flex:none}
.mmore{font-size:11.5px;color:var(--green-700);font-weight:700;background:none;border:0;text-align:start;padding:0 4px;cursor:pointer}
.mcf{color:var(--danger);font-weight:800;font-size:11.5px}

/* ---------- Week ---------- */
.wk-wrap{overflow:auto;max-height:calc(100vh - 240px);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.wk-grid{display:grid;grid-template-columns:56px repeat(7,minmax(130px,1fr));min-width:980px;position:relative}
.wk-head{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding:6px;font-size:12px;border-inline-start:1px solid var(--line-2);cursor:pointer;min-height:66px}
.wk-head.corner{cursor:default;border-inline-start:0}
.wk-head .wd{font-weight:700;color:var(--green-900);font-size:13px}
.wk-head.out-market{background:#f1efe8;color:#888}
.wk-head.is-selected{box-shadow:inset 0 -3px 0 var(--green-700)}
.wk-times{position:relative;border-inline-end:1px solid var(--line)}
.wk-times .wt{position:absolute;inset-inline-end:4px;font-size:11px;color:var(--ink-2);transform:translateY(-50%);font-weight:600}
.wk-day{position:relative;border-inline-start:1px solid var(--line-2);cursor:copy}
.wk-day .bg-closed{position:absolute;left:0;right:0;background:var(--closed-hatch)}
.wk-day .bg-open{position:absolute;left:0;right:0;background:#fffdf7}
.wk-day .gl{position:absolute;left:0;right:0;border-top:1px solid #e6e1d4;pointer-events:none}
.wk-day .gl.h{border-top-color:#d6cfbf}
.wk-day .bg-special{position:absolute;inset-inline-end:0;width:3px;background:rgba(184,145,58,.8)}
.wk-day.drop-target{background:rgba(184,145,58,.1)}
.wk-day .evb .handle{width:auto;height:7px;left:0;right:0;top:auto;bottom:0;cursor:ns-resize}
.wk-day .evb .handle.h-start{top:-2px;bottom:auto}

/* ---------- Table ---------- */
.tbl-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);max-height:calc(100vh - 260px)}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.data th{position:sticky;top:0;background:var(--green-900);color:#fff;text-align:start;font-weight:600;padding:7px 8px;white-space:nowrap;z-index:2}
table.data th button.sort{background:none;border:0;color:inherit;font-weight:600;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
table.data td{padding:5px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.data tr:hover td{background:#fcfaf3}
table.data tr.st-cancelled td{color:#888}
table.data tr.st-cancelled td.c-title{text-decoration:line-through}
table.data td.c-notes{max-width:260px;white-space:pre-wrap;font-size:12px}
table.data td input,table.data td select{min-height:28px;padding:2px 5px;font-size:12.5px}
table.data td input[type=text]{min-width:150px}
table.data .catcell{display:flex;align-items:center;gap:5px}
.col-picker{position:relative}
.col-picker .menu{position:absolute;top:100%;inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:8px;z-index:30;display:grid;gap:4px;min-width:200px;margin-top:4px}
.col-picker .menu label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}

/* ---------- Run of show ---------- */
.ros{display:grid;gap:8px}
.ros-item{display:grid;grid-template-columns:150px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--c,#777);border-radius:var(--radius);padding:10px 12px}
.ros-item .rt{font-weight:800;font-size:15px;color:var(--green-900)}
.ros-item .rcall{font-size:12px;color:var(--ink-2)}
.ros-item h3{margin:0 0 3px;font-size:15px}
.ros-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:4px 0}
.ros-notes{font-size:12.5px;white-space:pre-wrap;margin-top:4px}
.ros-notes b{color:var(--ink)}
.ros-marker{background:var(--cream);border:1px dashed var(--cream-3);border-radius:var(--radius);padding:6px 12px;font-weight:700;color:var(--green-900);font-size:13px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;border-top:3px solid var(--green-700)}
.kpi.b{border-top-color:var(--burg-700)} .kpi.g{border-top-color:var(--gold)}
.kpi .v{font-size:24px;font-weight:800;color:var(--green-900);line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dash-cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}
.daystrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.dsd{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 5px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px;font-size:11px;min-height:70px}
.dsd:hover{border-color:var(--green-700)}
.dsd.is-selected{outline:2px solid var(--green-700)}
.dsd .dn{font-weight:800;font-size:13px}
.dsd .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:auto}
.dsd .bar i{display:block;height:100%;background:var(--green-700)}
.dsd .st{font-size:10px;font-weight:700}
.dsd.closed{background:#f3f3f3}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:6px 0;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.list-plain li:last-child{border-bottom:0}

/* ---------- Conflicts ---------- */
.cf-item{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--danger);border-radius:var(--radius);padding:10px 12px;display:grid;gap:5px}
.cf-item.sev-medium{border-inline-start-color:#d99a12}
.cf-item.sev-low{border-inline-start-color:var(--info)}
.cf-item.acked{border-inline-start-color:var(--ok);background:#fbfefc}
.cf-item .cf-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cf-item .cf-reason{font-size:13.5px}
.cf-item .cf-evs{display:flex;gap:6px;flex-wrap:wrap}
.cf-item .ack-note{font-size:12.5px;background:var(--ok-bg);border-radius:5px;padding:4px 8px;color:#1b4d2f}
.cf-list{display:grid;gap:8px}

/* ---------- Settings ---------- */
.settings-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.settings-nav{position:sticky;top:120px;display:grid;gap:2px}
.settings-nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px}
.settings-nav a:hover{background:var(--cream-2)}
.settings-sec{margin-bottom:14px;scroll-margin-top:120px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field.full{grid-column:1/-1}
.field.check{flex-direction:row;align-items:center;gap:6px}
.field.check label{font-weight:500;color:var(--ink)}
table.cfg{border-collapse:collapse;width:100%;font-size:13px}
table.cfg th{text-align:start;font-size:12px;color:var(--ink-2);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.cfg td{padding:4px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.cfg input[type=text]{width:100%;min-width:110px}
.req{color:var(--danger)}
.err-text{color:var(--danger);font-size:12px}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(12,22,18,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--paper);border-radius:10px;box-shadow:var(--shadow-lg);width:min(860px,100%);display:flex;flex-direction:column;max-height:92vh}
.modal.sm{width:min(480px,100%)}
.modal.md{width:min(640px,100%)}
.modal-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:10px 10px 0 0}
.modal-h h2{margin:0;font-size:17px;color:var(--green-900);flex:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:0 0 10px 10px}
.modal-f .spacer{flex:1}
.ed-sec{border:1px solid var(--line-2);border-radius:var(--radius);margin-bottom:10px}
.ed-sec>summary{padding:8px 12px;cursor:pointer;font-weight:700;color:var(--green-900);background:var(--surface);border-radius:var(--radius);list-style-position:inside}
.ed-sec[open]>summary{border-bottom:1px solid var(--line-2);border-radius:var(--radius) var(--radius) 0 0}
.ed-sec>.sec-b{padding:10px 12px}
.ed-warnings{display:grid;gap:5px;margin-bottom:10px}
.ed-warn{font-size:12.5px;border-radius:5px;padding:5px 8px;display:flex;gap:6px;align-items:flex-start}
.ed-warn.high{background:var(--danger-bg);color:#7a1712}
.ed-warn.medium{background:var(--warn-bg);color:#5f3e00}
.ed-warn.low{background:var(--info-bg);color:#163f66}
.ed-warn.ok{background:var(--ok-bg);color:#1b4d2f}
.route-stops{display:grid;gap:5px}
.route-stop{display:flex;gap:6px;align-items:center}
.rec-preview{max-height:200px;overflow:auto;border:1px solid var(--line-2);border-radius:6px;font-size:12.5px}
.rec-preview div{padding:3px 8px;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip-check{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:12.5px;cursor:pointer;background:#fff}
.chip-check:has(input:checked){background:var(--green-100);border-color:var(--green-700)}
.chip-check input{margin:0}

/* ---------- Toast ---------- */
#toast-root{pointer-events:none;position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(-50%);z-index:300;display:grid;gap:6px;width:min(560px,92vw)}
html[dir="rtl"] #toast-root{transform:translateX(50%)}
.toast{pointer-events:auto;background:var(--green-950);color:#fff;padding:9px 12px;border-radius:7px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;font-size:13.5px}
.toast.error{background:var(--danger)}
.toast.warn{background:#6b4800}
.toast .grow{flex:1}
.toast button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 9px;cursor:pointer}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .dash-cols{grid-template-columns:1fr}
  .settings-layout{grid-template-columns:1fr}
  .settings-nav{position:static;display:flex;flex-wrap:wrap}
  .brand-text span{display:none}
}
@media (max-width:860px){
  :root{--label-w:130px}
  .topbar{flex-wrap:wrap;position:static}
  .toolbar{position:static}
  .nav{order:3;width:100%;margin:0}
  .ros-item{grid-template-columns:1fr}
  .mcell{min-height:96px}
  .mev .mc{display:none}
}

/* ---------- Print ---------- */
#print-root{display:none}
@media print{
  body{background:#fff;font-size:10.5pt}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  .p-page{page-break-after:always;break-after:page}
  .p-page:last-child{page-break-after:auto;break-after:auto}
}
#print-root{color:#000;font-family:var(--font)}
html[lang="ar"] #print-root{font-family:var(--font-ar)}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--green-900);padding-bottom:4px;margin-bottom:8px;gap:12px}
.p-head h1{font-size:16pt;margin:0;color:var(--green-900)}
.p-head .p-sub{font-size:9.5pt;color:#333}
.p-head .p-meta{font-size:8.5pt;color:#555;text-align:end}
.p-demo{font-size:8.5pt;font-weight:700;color:#6b4e00;border:1px solid #e2c46a;background:#fff8dc;padding:1px 5px;border-radius:3px;display:inline-block}
table.p-tbl{width:100%;border-collapse:collapse;font-size:8.5pt}
table.p-tbl th{background:#e8efe9!important;text-align:start;border:1px solid #999;padding:3px 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.p-tbl td{border:1px solid #bbb;padding:3px 4px;vertical-align:top}
table.p-tbl tr{break-inside:avoid}
table.p-tbl thead{display:table-header-group}
.p-dayhdr td{background:#f4efe1!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-ros{display:grid;gap:5px}
.p-ros-item{display:grid;grid-template-columns:120px 1fr;gap:8px;border:1px solid #999;border-inline-start:5px solid var(--c,#555);padding:5px 8px;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-ros-item h3{margin:0;font-size:11pt}
.p-ros-item .rt{font-weight:800;font-size:11pt}
.p-ros-item .m{font-size:8.5pt;color:#222}
.p-month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #888;font-size:7.5pt}
.p-month .dow{background:#14372a!important;color:#fff!important;font-weight:700;padding:3px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-month .c{border:1px solid #bbb;min-height:84px;padding:2px 3px;overflow:hidden}
.p-month .c.out{background:#f1f1f1!important;color:#999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-month .c .n{font-weight:800;font-size:9pt}
.p-month .c .h{font-size:7pt;color:#444}
.p-month .c .e{border-inline-start:3px solid var(--c,#555);padding-inline-start:3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-tl{position:relative;border:1px solid #888;font-size:7.5pt}
.p-tl .row{display:flex;border-bottom:1px solid #ccc;position:relative}
.p-tl .lab{width:110px;flex:none;padding:3px 4px;border-inline-end:1px solid #888;font-weight:700;font-size:8pt}
.p-tl .trk{position:relative;flex:1}
.p-tl .axis{height:18px}
.p-tl .tick{position:absolute;top:0;bottom:0;border-inline-start:1px solid #ccc}
.p-tl .tick span{position:absolute;top:2px;inset-inline-start:2px;font-weight:700;font-size:7.5pt;white-space:nowrap}
.p-tl .closed{position:absolute;top:0;bottom:0;background:#e6e6e6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-tl .blk{position:absolute;border:1px solid #444;border-inline-start:4px solid var(--c,#555);background:#fff!important;padding:1px 3px;overflow:hidden;font-size:7pt;line-height:1.2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-tl .blk.roam{border-style:dashed;border-inline-start-style:solid}
.p-tl .blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-foot{margin-top:6px;font-size:7.5pt;color:#555}

/* ---------- Simplified chrome ---------- */
.toolbar .tool-end{margin-inline-start:auto}
.filter-panel{flex-basis:100%;padding-top:2px}
.count-badge{background:var(--burg-700);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.toolbar input[type=search]{width:240px;max-width:40vw}

details.adv{margin-top:10px}

.ed-essentials .form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}

.ed-sub{margin:12px 0 6px;font-size:13px;color:var(--green-900)}

.skip-link:focus{top:8px}

/* ---------- 4. Validation & normalisation (used for stored data AND imported backups) ---------- */
function validateData(d) {

  if (typeof d.schemaVersion !== 'number') errors.push('Missing schemaVersion.');
  else if (d.schemaVersion > APP.schemaVersion) errors.push(`Backup schema version ${d.schemaVersion} is newer than this app supports (${APP.schemaVersion}).`);
  if (!d.settings || typeof d.settings !== 'object') errors.push('Missing settings.');
  else {
    if (!isValidDate(d.settings.marketStart) || !isValidDate(d.settings.marketEnd)) errors.push('Market start/end dates are invalid.');
    else if (d.settings.marketStart > d.settings.marketEnd) errors.push('Market start is after market end.');
    if (!Array.isArray(d.settings.weeklyHours) || d.settings.weeklyHours.length !== 7) errors.push('Weekly hours must list 7 days.');
    else d.settings.weeklyHours.forEach((w, i) => { if (!w.closed && (!TIME_RE.test(w.open) || !TIME_RE.test(w.close))) errors.push(`Weekly hours for weekday ${i} are invalid.`); });

      for (const [k, o] of Object.entries(d.settings.dateOverrides)) {
        if (!isValidDate(k)) errors.push(`Date override key "${k}" is not a valid date.`);
        else if (o && o.hoursMode === 'custom' && (!TIME_RE.test(o.open) || !TIME_RE.test(o.close))) errors.push(`Custom hours for ${k} are invalid.`);
      }
    }
  }
  for (const key of ['categories', 'resources', 'performers', 'events']) if (!Array.isArray(d[key])) errors.push(`Missing ${key} list.`);
  if (errors.length) return { ok: false, errors, warnings };
  const idSets = {};
  for (const key of ['categories', 'resources', 'performers', 'events']) {

/* ---------- Modal ---------- */
const Modal = {
  stack: [],
  open({ title, body, footer = '', size = '', onMount, onClose, beforeClose, labelledBy }) {
    const root = document.getElementById('modal-root');
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    const id = uid('m');
    back.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${id}-t">
      <div class="modal-h"><h2 id="${id}-t">${title}</h2><button type="button" class="btn ghost icon" data-close aria-label="${esc(t('act.close'))}">✕</button></div>
      <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
    root.appendChild(back);
    const prevFocus = document.activeElement;
    const handle = {
      el: back.querySelector('.modal'), back,
      async close(force) {
        if (!force && beforeClose && !(await beforeClose())) return false;
        back.remove(); Modal.stack = Modal.stack.filter(h => h !== handle);
        if (onClose) onClose();
        if (prevFocus && prevFocus.isConnected) prevFocus.focus({ preventScroll: true });
        return true;
      }
    };
    back.addEventListener('mousedown', e => { if (e.target === back) handle._downOnBack = true; else handle._downOnBack = false; });
    back.addEventListener('click', e => { if (e.target === back && handle._downOnBack) handle.close(); if (e.target.closest('[data-close]')) handle.close(); });
    back.addEventListener('keydown', e => {
      if (e.key === 'Tab') { // simple focus trap
        const f = [...handle.el.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"]),summary,a[href]')].filter(x => !x.disabled && x.offsetParent !== null);
        if (!f.length) return; const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
        else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
      }
    });
    Modal.stack.push(handle);
    if (onMount) onMount(handle);
    const ff = handle.el.querySelector('[autofocus]') || handle.el.querySelector('.modal-b input,.modal-b select,.modal-b textarea,.modal-b button') || handle.el.querySelector('button');
    if (ff) ff.focus();
    return handle;
  },
  top() { return this.stack[this.stack.length - 1]; }
};
function confirmDialog({ title, message, ok, danger = false, cancel }) {
  return new Promise(resolve => {
    let result = false;
    const h = Modal.open({
      title: esc(title), size: 'sm',
      body: `<p style="margin:0;white-space:pre-wrap">${message}</p>`,
      footer: `<span class="spacer"></span><button type="button" class="btn" data-close>${esc(cancel || t('act.cancel'))}</button><button type="button" class="btn ${danger ? 'danger solid' : 'primary'}" data-ok autofocus>${esc(ok || t('act.ok'))}</button>`,
      onClose: () => resolve(result)
    });
    h.el.querySelector('[data-ok]').addEventListener('click', () => { result = true; h.close(true); });
  });
}
function promptDialog({ title, message, label, value = '', ok, multiline = true }) {
  return new Promise(resolve => {
    let result = null;
    const field = multiline ? `<textarea id="prompt-in" rows="3">${esc(value)}</textarea>` : `<input type="text" id="prompt-in" value="${esc(value)}">`;
    const h = Modal.open({
      title: esc(title), size: 'sm',
      body: `${message ? `<p style="margin-top:0">${message}</p>` : ''}<div class="field"><label for="prompt-in">${esc(label)}</label>${field}</div>`,
      footer: `<span class="spacer"></span><button type="button" class="btn" data-close>${esc(t('act.cancel'))}</button><button type="button" class="btn primary" data-ok>${esc(ok || t('act.ok'))}</button>`,
      onClose: () => resolve(result)
    });
    const inp = h.el.querySelector('#prompt-in'); inp.focus();
    h.el.querySelector('[data-ok]').addEventListener('click', () => { result = inp.value; h.close(true); });
  });
}
function alertDialog(title, messageHTML) {
  return new Promise(resolve => {
    Modal.open({ title: esc(title), size: 'sm', body: messageHTML, footer: `<span class="spacer"></span><button type="button" class="btn primary" data-close autofocus>${esc(t('act.ok'))}</button>`, onClose: resolve });
  });
}

/* ---------- Toast ---------- */
function toast(msg, { type = '', action = null, timeout = 5000 } = {}) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `<span class="grow">${esc(msg)}</span>${action ? `<button type="button" data-a>${esc(action.label)}</button>` : ''}<button type="button" data-x aria-label="${esc(t('act.close'))}">✕</button>`;
  root.appendChild(el);
  const kill = () => el.remove();
  if (action) el.querySelector('[data-a]').addEventListener('click', () => { action.fn(); kill(); });
  el.querySelector('[data-x]').addEventListener('click', kill);
  setTimeout(kill, timeout);
  while (root.children.length > 3) root.firstChild.remove();
}
function undoToast(msg, extraType) { toast(msg, { type: extraType || '', action: { label: t('act.undo'), fn: () => { const l = undo(); if (l) toast(t('toast.undone')); } }, timeout: 7000 }); }

/* ---------- downloads ---------- */
function download(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  if (IS_ARTIFACT) { Cloud.save(filename, blob); return; } // the Artifact frame blocks page-started downloads
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const fileStamp = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); };

/** Text summary of an event for tooltips / screen readers. */
function evSummary(e) {
  const parts = [e.title, fmtRangeText(evStart(e), evEnd(e)), t('type.' + e.type), catName(e.categoryId), perfName(e.performerId), locName(e), t('status.' + e.status)];
  const cf = eventConflicts(e.id);
  if (cf.length) parts.push(t('conf.nWarnings', { n: cf.length }));
  if (e.demo) parts.push(t('demo.long'));
  return parts.filter(Boolean).join(' · ');
}
function cfMarks(e) {
  const cf = eventConflicts(e.id);
  if (!cf.length) return { cls: '', html: '' };
  const open = cf.filter(c => !c.ack).length;
  return open ? { cls: 'has-conflict', html: `<span class="cf" aria-hidden="true">⚠</span>` } : { cls: 'has-conflict ack-only', html: `<span class="ack-mark" aria-hidden="true">✓</span>` };
}
/** Greedy lane assignment for overlapping items: sets item.lane, returns lane count. */
function assignLanes(items) {
  items.sort((a, b) => a.s - b.s || b.en - a.en);
  const laneEnds = [];
  for (const it of items) {
    let l = laneEnds.findIndex(end => end <= it.s);
    if (l === -1) { l = laneEnds.length; laneEnds.push(it.en); } else laneEnds[l] = it.en;
    it.lane = l;
  }
  return Math.max(1, laneEnds.length);
}

            ${day.inMarket ? `<div class="mhours">${day.closed ? `<span class="tag closed">${esc(t('hours.closed'))}</span>` : hoursHTML(day)}${day.override && day.override.hoursMode === 'custom' ? ` <span class="tag override" title="${esc(t('hours.override'))}">${esc(t('hours.custom'))}</span>` : ''}</div>` : ''}
            ${openCf ? `<div class="mcf">⚠ ${esc(t('conf.nWarnings', { n: openCf }))}</div>` : (cf.length ? `<div class="small" style="color:var(--ok)">✓ ${esc(t('conf.nAcked', { n: cf.length }))}</div>` : '')}
            ${shown.slice(0, MAX).map(e => `<button type="button" class="mev ${e.type} st-${e.status}" style="--c:${esc(catColor(e.categoryId))}" data-open-ev="${esc(e.id)}" title="${esc(evSummary(e))}"><span class="mt">${e.type === 'roaming' ? '⟲' : '▣'} ${tm(evStart(e))}</span><span class="mn">${u(e.title)}</span><span class="mc">${esc(catName(e.categoryId))}</span>${eventConflicts(e.id).some(c => !c.ack) ? '<span class="warn-icon">⚠</span>' : ''}</button>`).join('')}
            ${shown.length > MAX ? `<button type="button" class="mmore" data-day="${d}">${esc(t('month.more', { n: shown.length - MAX }))}</button>` : ''}
            ${filtersActive() && all.length !== shown.length ? `<span class="small muted">${esc(t('month.hiddenByFilter', { n: all.length - shown.length }))}</span>` : ''}
          </div>`;
    }).join('')}
      </div>`;
  }
};

/* ======================= DAILY TIMELINE ======================= */
const TL = { ctx: null }; // geometry of the last rendered timeline (used by drag handlers)
VIEWS.day = {
  filters: true,
  render() {
    const date = ui.date, day = getDayInfo(date);
    const all = eventsOn(date);
    const shown = all.filter(matchesFilters);
    // time range: operating hours, widened to include any event or special window on this date
    let rs, re;
    if (!day.closed) { rs = day.open; re = day.close; }
    else { const w = state.settings.weeklyHours[day.wd]; rs = w.closed ? 960 : toMin(w.open); re = w.closed ? 1380 : toMin(w.close); if (re <= rs) re += 1440; }
    for (const e of all) { rs = Math.min(rs, evStart(e)); re = Math.max(re, evEnd(e)); }
    if (day.special && day.special.start !== null) { rs = Math.min(rs, day.special.start); re = Math.max(re, day.special.end); }
    rs = Math.floor(rs / 60) * 60; re = Math.ceil(re / 60) * 60;
    if (re - rs < 120) re = rs + 120;
    const dense = ui.tl.density === 'compact';
    const ppm = (dense ? 2.0 : 3.4) * ui.tl.zoom;
    const width = Math.round((re - rs) * ppm);
    const laneH = dense ? 26 : 56, lanePad = 4;
    TL.ctx = { date, rs, re, ppm, laneH };
    const X = m => Math.round((m - rs) * ppm);
    const today = todayAmman();
    // ---- axis
    let axis = '';
    for (let m = rs; m <= re; m += 30) {
      if (m % 60 === 0) axis += `<div class="tl-hour" style="inset-inline-start:${X(m)}px"><span>${esc(fmtHourLabel(m))}</span></div>`;
      else axis += `<div class="tl-half" style="inset-inline-start:${X(m)}px"></div>`;
    }
    if (!day.closed) {
      axis += `<div class="open-mark" style="inset-inline-start:${X(day.open) + 3}px">${esc(t('tl.opens'))} ${esc(fmtTime(day.open))}</div>`;
      axis += `<div class="close-mark" style="inset-inline-start:${Math.max(0, X(day.close) - 110)}px">${esc(t('tl.closes'))} ${esc(fmtTime(day.close))}</div>`;
    }
    if (day.special && day.special.start !== null) axis += `<div class="special-band" style="inset-inline-start:${X(day.special.start)}px;width:${X(day.special.end) - X(day.special.start)}px" title="${esc(day.special.title)}"></div>`;
    // ---- shared track background
    const gridLines = (() => { let s = ''; for (let m = rs; m <= re; m += 30) s += `<div class="gl ${m % 60 === 0 ? 'h' : ''}" style="inset-inline-start:${X(m)}px"></div>`; return s; })();
    const bg = day.closed ? `<div class="bg-closed" style="inset-inline-start:0;width:${width}px"></div>`
      : `<div class="bg-closed" style="inset-inline-start:0;width:${X(day.open)}px"></div><div class="bg-open" style="inset-inline-start:${X(day.open)}px;width:${X(day.close) - X(day.open)}px"></div><div class="bg-closed" style="inset-inline-start:${X(day.close)}px;width:${width - X(day.close)}px"></div>`;
    const ocLines = day.closed ? '' : `<div class="oc-line" style="inset-inline-start:${X(day.open)}px"></div><div class="oc-line close" style="inset-inline-start:${X(day.close)}px"></div>`;
    const special = day.special && day.special.start !== null ? `<div class="bg-special" style="inset-inline-start:${X(day.special.start)}px;width:${X(day.special.end) - X(day.special.start)}px"></div>` : '';
    const nowM = nowMinAmman();
    const nowLine = (date === today && nowM >= rs && nowM <= re) ? `<div class="now-line" style="inset-inline-start:${X(nowM)}px" title="${esc(t('tl.now'))}"></div>` : '';
    const trackBase = bg + gridLines + special + ocLines + nowLine + `<div class="hover-slot"></div>`;
    // ---- rows
    const rowsHTML = [];
    const block = (it) => {
      const e = it.e; const s = it.s, en = it.en;
      const w = Math.max(6, X(en) - X(s));
      const top = lanePad + it.lane * (laneH + lanePad);
      const marks = cfMarks(e);
      const icon = e.type === 'roaming' ? '⟲' : '▣';
      const lines = dense
        ? `<div class="t1">${marks.html}<span class="ic">${icon}</span>${w > 90 ? `<span>${esc(fmtTime(s))}</span>` : ''}<span>${u(e.title)}</span>${e.demo && w > 140 ? '<span class="demo-mini">DEMO</span>' : ''}</div>`
        : `<div class="t1">${marks.html}<span class="ic">${icon}</span><span style="overflow:hidden;text-overflow:ellipsis">${u(e.title)}</span>${e.demo ? '<span class="demo-mini">DEMO</span>' : ''}</div>
           <div class="t2">${tmRange(s, en)} · ${esc(t('status.' + e.status))}</div>
           <div class="t3">${esc(catName(e.categoryId))}${e.performerId ? ' · ' + u(perfName(e.performerId)) : ''}</div>`;
      const handles = `<span class="handle h-start" aria-hidden="true"></span><span class="handle h-end" aria-hidden="true"></span>`;
      return `<div class="evb ${e.type} st-${e.status} ${marks.cls}" role="button" tabindex="0" data-ev="${esc(e.id)}"
          style="--c:${esc(catColor(e.categoryId))};inset-inline-start:${X(s)}px;width:${w}px;top:${top}px;height:${laneH}px"
          title="${esc(evSummary(e) + '\n' + t('tl.dragHint'))}" aria-label="${esc(evSummary(e))}">${handles}${lines}</div>`;
    };
    const row = (key, label, sub, items, attrs, opts = {}) => {
      const collapsed = !!ui.tl.collapsed[key];
      const n = items.filter(i => !i.ghost).length;
      let content = '', h;
      if (collapsed) {
        h = 26;
        content = `<span class="collapsed-info">${esc(t('tl.collapsedN', { n }))}</span>` + items.filter(i => !i.ghost).map(it => `<div class="evb ${it.e.type}" data-ev="${esc(it.e.id)}" data-ghost="1" role="button" tabindex="0" style="--c:${esc(catColor(it.e.categoryId))};inset-inline-start:${X(it.s)}px;width:${Math.max(4, X(it.en) - X(it.s))}px;top:16px;height:7px;padding:0;border-width:1px" title="${esc(evSummary(it.e))}" aria-label="${esc(evSummary(it.e))}"></div>`).join('');
      } else {
        const lanes = assignLanes(items);
        h = lanes * (laneH + lanePad) + lanePad;
        content = items.map(block).join('');
      }
      return `<div class="tl-row ${collapsed ? 'collapsed' : ''}" data-row="${esc(key)}">
          <div class="tl-label"><button type="button" class="collapse" data-collapse="${esc(key)}" aria-expanded="${!collapsed}" aria-label="${esc((collapsed ? t('tl.expand') : t('tl.collapse')) + ': ' + label)}">${collapsed ? (isRTL() ? '◂' : '▸') : '▾'}</button>
            <div style="min-width:0"><div class="rl-name">${u(label)}</div>${sub ? `<div class="rl-sub">${sub}</div>` : ''}</div></div>
          <div class="tl-track" ${attrs} style="width:${width}px;height:${h}px" aria-label="${esc(label)}">${trackBase}${content}</div></div>`;
    };
    const groupRow = (label, extra = '') => `<div class="tl-group"><div class="tl-label" style="align-items:center;gap:8px;flex-wrap:wrap">${esc(label)}${extra}</div><div style="width:${width}px;height:${extra ? 34 : 24}px;flex:none"></div></div>`;
    const item = (e, rowMode) => ({ e, s: evStart(e), en: evEnd(e), rowMode });
    // stages
    rowsHTML.push(groupRow(t('tl.stages')));
    const stageList = stages();
    for (const st of stageList) {
      const items = shown.filter(e => e.resourceId === st.id).map(e => item(e, 'res'));
      rowsHTML.push(row('res:' + st.id, dname(st), esc(t('tl.nEvents', { n: items.length })), items, `data-res="${esc(st.id)}" data-kind="stage"`));
    }
    // stage acts without a (known) stage
    const unassigned = shown.filter(e => e.type === 'stage' && (!e.resourceId || !lookup.res(e.resourceId)));
    if (unassigned.length) rowsHTML.push(row('res:__none', t('misc.unassigned'), esc(t('tl.unassignedHint')), unassigned.map(e => item(e, 'res')), `data-res="" data-kind="none"`));
    // roaming acts: no fixed location, so one row per roaming group shows when each is out in the market
    rowsHTML.push(groupRow(t('tl.roamGroups')));
    const roamEvs = shown.filter(e => e.type === 'roaming');
    const perfIds = [...new Set(roamEvs.map(e => e.performerId))];
    if (!filtersActive()) for (const p of state.performers) if (p.kind !== 'stage' && !perfIds.includes(p.id)) perfIds.push(p.id);
    if (!perfIds.length) perfIds.push('');
    perfIds.sort((a, b) => (a ? 0 : 1) - (b ? 0 : 1) || perfName(a).localeCompare(perfName(b)));
    for (const pid of perfIds) {
      const items = roamEvs.filter(e => e.performerId === pid).map(e => item(e, 'perf'));
      const label = pid ? perfName(pid) : (roamEvs.length ? t('tl.noPerformer') : t('tl.roamingRow'));
      rowsHTML.push(row('perf:' + (pid || '__none'), label, esc(t('tl.nEvents', { n: items.length })), items, `data-perf="${esc(pid)}" data-kind="perf"`));
    }
    const initialScroll = (!day.closed && day.open > rs) ? Math.max(0, X(day.open) - 40) : 0;
    const special2 = day.special ? `<span class="tag special">★ ${u(day.special.title)}${day.special.start !== null ? ' · ' + tmRange(day.special.start, day.special.end) : ''}</span>` : '';
    return `
      <div class="tl-head-info">
        <button type="button" class="btn icon" data-act="date-prev" aria-label="${esc(t('date.prev'))}">${isRTL() ? '›' : '‹'}</button>
        <h1 class="day-title">${esc(fmtDateLong(date))}</h1>
        <button type="button" class="btn icon" data-act="date-next" aria-label="${esc(t('date.next'))}">${isRTL() ? '‹' : '›'}</button>
        <span class="hours-chip ${day.closed ? 'closed' : ''}">${esc(t('tl.hours'))}: ${hoursHTML(day)}</span>
        ${day.inMarket && day.override && day.override.hoursMode === 'custom' ? `<span class="tag override">${esc(t('hours.override'))}</span>` : ''}
        ${special2}
        ${all.length !== shown.length ? `<span class="tag closed">${esc(t('tl.filtered', { a: shown.length, b: all.length }))}</span>` : ''}
        <span style="flex:1"></span>
        <span class="seg" role="group" aria-label="${esc(t('tl.density'))}"><button type="button" data-density="compact" aria-pressed="${dense}">${esc(t('tl.compact'))}</button><button type="button" data-density="detailed" aria-pressed="${!dense}">${esc(t('tl.detailed'))}</button></span>
        <span class="seg" role="group" aria-label="${esc(t('tl.zoom'))}"><button type="button" data-zoom="-1" aria-label="${esc(t('tl.zoomOut'))}">−</button><button type="button" data-zoom="0" aria-label="${esc(t('tl.zoomReset'))}">${Math.round(ui.tl.zoom * 100)}%</button><button type="button" data-zoom="1" aria-label="${esc(t('tl.zoomIn'))}">＋</button></span>
        ${Object.values(ui.tl.collapsed).some(Boolean) ? `<button type="button" class="btn sm" data-act="expand-all">${esc(t('tl.expandAll'))}</button>` : ''}
        <button type="button" class="btn sm" data-act="show-ros">${esc(t('ros.title'))}</button>
      </div>
      ${!day.inMarket ? `<div class="banner warn">${esc(t('tl.outsideMarket'))}</div>` : day.closed ? `<div class="banner warn">${esc(t('tl.closedDay'))}</div>` : ''}
      ${legendHTML(t('tl.help') + (isRTL() ? ' ' + t('tl.rtlNote') : ''))}
      <div class="tl-wrap" data-scroll-key="tl-${date}" data-initial-scroll="${initialScroll}" id="tl-wrap">
        <div class="tl-grid" style="width:calc(var(--label-w) + ${width}px)">
          <div class="tl-head"><div class="tl-corner">${esc(t('tl.resource'))}</div><div class="tl-axis" style="width:${width}px">${axis}</div></div>
          ${rowsHTML.join('')}
        </div>
      </div>`;
  }
};

/* ======================= WEEK ======================= */
const WK = { ctx: null };
VIEWS.week = {
  filters: true,
  render() {
    const ws = startOfWeek(ui.date);
    const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
    const infos = days.map(getDayInfo);
    let rs = Infinity, re = -Infinity;
    infos.forEach(i => { if (!i.closed) { rs = Math.min(rs, i.open); re = Math.max(re, i.close); } });
    if (rs === Infinity) { rs = 960; re = 1380; }
    const evsByDay = days.map(d => eventsOn(d));
    evsByDay.flat().forEach(e => { rs = Math.min(rs, evStart(e)); re = Math.max(re, evEnd(e)); });
    rs = Math.floor(rs / 60) * 60; re = Math.ceil(re / 60) * 60;
    const ppm = ui.week.density === 'compact' ? 0.8 : 1.25;
    const H = Math.round((re - rs) * ppm);
    const Y = m => Math.round((m - rs) * ppm);
    WK.ctx = { days, rs, re, ppm };
    let times = '';
    for (let m = rs; m <= re; m += 60) times += `<div class="wt" style="top:${Y(m)}px">${esc(fmtHourLabel(m))}</div>`;
    const lines = (() => { let s = ''; for (let m = rs; m <= re; m += 30) s += `<div class="gl ${m % 60 === 0 ? 'h' : ''}" style="top:${Y(m)}px"></div>`; return s; })();
    const compact = ui.week.density === 'compact';
    const cols = days.map((d, i) => {
      const info = infos[i];
      const bg = info.closed ? `<div class="bg-closed" style="top:0;height:${H}px"></div>` : `<div class="bg-closed" style="top:0;height:${Y(info.open)}px"></div><div class="bg-open" style="top:${Y(info.open)}px;height:${Y(info.close) - Y(info.open)}px"></div><div class="bg-closed" style="top:${Y(info.close)}px;height:${H - Y(info.close)}px"></div>`;
      const sp = info.special && info.special.start !== null ? `<div class="bg-special" style="top:${Y(info.special.start)}px;height:${Y(info.special.end) - Y(info.special.start)}px" title="${esc(info.special.title)}"></div>` : '';
      const items = evsByDay[i].filter(matchesFilters).map(e => ({ e, s: evStart(e), en: evEnd(e) }));
      const n = assignLanes(items);
      const blocks = items.map(it => {
        const e = it.e; const marks = cfMarks(e);
        const h = Math.max(14, Y(it.en) - Y(it.s));
        return `<div class="evb ${e.type} st-${e.status} ${marks.cls}" role="button" tabindex="0" data-ev="${esc(e.id)}" style="--c:${esc(catColor(e.categoryId))};top:${Y(it.s)}px;height:${h}px;inset-inline-start:calc(${(it.lane / n * 100).toFixed(3)}% + 2px);width:calc(${(100 / n).toFixed(3)}% - 4px);white-space:normal" title="${esc(evSummary(e) + '\n' + t('wk.dragHint'))}" aria-label="${esc(evSummary(e))}">
            <span class="handle h-start" aria-hidden="true"></span><span class="handle h-end" aria-hidden="true"></span>
            <div class="t1">${marks.html}<span class="ic">${e.type === 'roaming' ? '⟲' : '▣'}</span><span>${esc(fmtTime(it.s))}</span></div>
            <div class="t1" style="font-weight:600">${u(e.title)}</div>
            ${!compact && h > 46 ? `<div class="t3">${esc(catName(e.categoryId))}</div><div class="t3">${esc(locName(e))}</div>` : ''}
            ${e.demo && h > 70 ? '<span class="demo-mini">DEMO</span>' : ''}</div>`;
      }).join('');
      return `<div class="wk-day" data-date="${d}" style="height:${H}px">${bg}${lines}${sp}${blocks}</div>`;
    }).join('');
    const heads = days.map((d, i) => {
      const info = infos[i];
      return `<div class="wk-head ${info.inMarket ? '' : 'out-market'} ${d === ui.date ? 'is-selected' : ''}" data-go-day="${d}" role="button" tabindex="0" title="${esc(t('wk.openDay'))}">
        <div class="wd">${esc(fmtWeekday(d))} ${esc(fmtDate(d, { day: 'numeric', month: 'short' }))}</div>
        <div>${info.closed ? `<span class="tag closed">${esc(info.inMarket ? t('hours.closed') : t('hours.outsideMarket'))}</span>` : hoursHTML(info)}</div>
        ${info.special ? `<div><span class="tag special">★ ${u(info.special.title)}</span></div>` : ''}
        <div class="small muted">${esc(t('misc.nEvents', { n: evsByDay[i].length }))}</div></div>`;
    }).join('');
    return `
      <div class="view-head">
        <button type="button" class="btn icon" data-week="-1" aria-label="${esc(t('wk.prev'))}">${isRTL() ? '›' : '‹'}</button>
        <h1>${esc(t('wk.title', { a: fmtDateShort(days[0]), b: fmtDate(days[6], { month: 'short', day: 'numeric', year: 'numeric' }) }))}</h1>
        <button type="button" class="btn icon" data-week="1" aria-label="${esc(t('wk.next'))}">${isRTL() ? '‹' : '›'}</button>
        <span class="spacer"></span>
        <span class="seg" role="group" aria-label="${esc(t('tl.density'))}"><button type="button" data-wdensity="compact" aria-pressed="${compact}">${esc(t('tl.compact'))}</button><button type="button" data-wdensity="detailed" aria-pressed="${!compact}">${esc(t('tl.detailed'))}</button></span>
      </div>
      ${legendHTML(t('wk.help'))}
      <div class="wk-wrap" data-scroll-key="wk" id="wk-wrap">
        <div class="wk-grid">
          <div class="wk-head corner"></div>${heads}
          <div class="wk-times" style="height:${H}px">${times}</div>${cols}
        </div>
      </div>`;
  }
};

/* ======================= MASTER TABLE & RUN OF SHOW ======================= */
const TABLE_COLS = [
  { k: 'date', lbl: 'field.date', fixed: true, sort: e => e.date + e.start },
  { k: 'day', lbl: 'col.day', sort: e => weekdayOf(e.date) * 10000 + evStart(e) },
  { k: 'start', lbl: 'field.start', fixed: true, sort: e => evStart(e) },
  { k: 'end', lbl: 'field.end', fixed: true, sort: e => evEnd(e) },
  { k: 'duration', lbl: 'field.duration', sort: e => evDuration(e) },
  { k: 'title', lbl: 'field.title', fixed: true, sort: e => e.title.toLowerCase() },
  { k: 'category', lbl: 'field.category', sort: e => catName(e.categoryId).toLowerCase() },
  { k: 'performer', lbl: 'field.performer', sort: e => perfName(e.performerId).toLowerCase() },
  { k: 'type', lbl: 'field.type', sort: e => e.type },
  { k: 'resource', lbl: 'field.resource', sort: e => locName(e).toLowerCase() },
  { k: 'status', lbl: 'field.status', sort: e => STATUSES.indexOf(e.status) },
  { k: 'priority', lbl: 'field.priority', sort: e => PRIORITIES.indexOf(e.priority) },
  { k: 'contact', lbl: 'col.contact', sort: e => (e.contactName || '').toLowerCase() },
  { k: 'notes', lbl: 'field.prodNotes', sort: e => (e.prodNotes || '').toLowerCase() },
  { k: 'conflicts', lbl: 'col.conflicts', sort: e => -eventConflicts(e.id).filter(c => !c.ack).length }
];
function tableRows() {
  const f = ui.table;
  let rows = state.events.filter(matchesFilters);
  if (f.from) rows = rows.filter(e => e.date >= f.from);
  if (f.to) rows = rows.filter(e => e.date <= f.to);
  const col = TABLE_COLS.find(c => c.k === f.sortKey) || TABLE_COLS[0];
  rows.sort((a, b) => { const x = col.sort(a), y = col.sort(b); const r = x < y ? -1 : x > y ? 1 : 0; return (r || (a.date + a.start).localeCompare(b.date + b.start)) * f.sortDir; });
  return rows;
}
VIEWS.table = {
  filters: true,
  render() {
    const f = ui.table;
    const modeSeg = `<span class="seg" role="group" aria-label="${esc(t('tbl.mode'))}"><button type="button" data-tmode="table" aria-pressed="${f.mode === 'table'}">${esc(t('tbl.master'))}</button><button type="button" data-tmode="ros" aria-pressed="${f.mode === 'ros'}">${esc(t('ros.title'))}</button></span>`;
    if (f.mode === 'ros') return `<div class="view-head"><h1>${esc(t('ros.title'))}<small>${esc(fmtDateLong(ui.date))}</small></h1><span class="spacer"></span>${modeSeg}
        <button type="button" class="btn" data-act="print-ros">🖨 ${esc(t('print.ros'))}${IS_ARTIFACT ? ' (.html)' : ''}</button><button type="button" class="btn" data-act="csv-day">⇩ CSV</button></div>${this.ros(ui.date)}`;
    const rows = tableRows();
    const vis = state.settings.tableColumns;
    const cols = TABLE_COLS.filter(c => c.fixed || vis[c.k]);
    const arrow = k => f.sortKey === k ? (f.sortDir > 0 ? ' ▲' : ' ▼') : '';
    const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
    const cell = (e, k) => {
      const id = esc(e.id);

/* ======================= CONFLICTS ======================= */
function conflictReason(c) {
  const p = c.params || {};
  const names = c.eventIds.map(id => { const e = lookup.ev(id); return e ? `“${e.title}”` : id; }).join(t('misc.and'));
  switch (c.sub) {
    case 'stage-overlap': return t('cf.stageOverlap', { res: resName(p.res), names });
    case 'performer-overlap': return t('cf.performerOverlap', { perf: perfName(p.perf), names });
    case 'changeover': return t('cf.changeover', { res: resName(p.res), gap: p.gap, need: p.need, names });
    case 'break': return t('cf.break', { perf: perfName(p.perf), gap: p.gap, need: p.need });
    case 'daily-load': return t('cf.dailyLoad', { perf: perfName(p.perf), total: p.total, need: p.need });
    case 'outside-market': return t('cf.outsideMarket', { names });
    case 'market-closed': return t('cf.marketClosed', { names });
    case 'outside-hours': return t('cf.outsideHours', { names, open: fmtTime(p.open), close: fmtTime(p.close) });
    case 'before-open': return t('cf.beforeOpen', { names, open: fmtTime(p.open) });
    case 'after-close': return t('cf.afterClose', { names, close: fmtTime(p.close) });
    case 'missing': return t('cf.missing', { names, status: t('status.' + p.status), fields: p.missing.map(m => t('missing.' + m)).join(', ') });
  }
  return c.sub;
}

  const footer = `${!isNew ? `<button type="button" class="btn danger" id="ed-delete">🗑 ${esc(t('act.delete'))}</button>

      <button type="button" class="btn" id="ed-duplicate">⧉ ${esc(t('act.duplicate'))}</button>` : ''}
    <span class="spacer"></span>
    <button type="button" class="btn" data-close>${esc(t('act.close'))}</button>
    <button type="button" class="btn primary" id="ed-save">${esc(isNew ? t('ed.create') : t('act.save'))}</button>`;

  let saved = false;
  const h = Modal.open({
    title, body, footer,
    beforeClose: async () => {
      if (saved) return true;
      readForm();
      if (JSON.stringify(draft) === original && rec.mode === 'none') return true;
      return confirmDialog({ title: t('ed.discardTitle'), message: esc(t('ed.discardMsg')), ok: t('ed.discard'), danger: true });
    }
  });
  const $ = sel => h.el.querySelector(sel);

  function readForm() {
    draft.title = $('#ed-title').value.trim();
    draft.type = $('#ed-type').value;
    draft.categoryId = $('#ed-category').value;
    draft.performerId = $('#ed-performer').value;
    draft.resourceId = $('#ed-resource').value;
    draft.date = $('#ed-date').value;
    draft.start = $('#ed-start').value;
    draft.end = $('#ed-end').value;
    draft.status = $('#ed-status').value;
    draft.priority = $('#ed-priority').value;
    for (const k of ['setupMin', 'soundcheckMin', 'changeoverMin', 'breakMin']) draft[k] = Math.max(0, Math.round(Number($('#ed-' + k).value) || 0));
    for (const k of ['contactName', 'contact', 'tech', 'prodNotes', 'internalNotes', 'specialEvent', 'fee']) draft[k] = $('#ed-' + k).value;
    draft.demo = $('#ed-demo').checked;
    if (draft.type === 'roaming') draft.resourceId = '';
  }
  /** Returns { errors: {fieldId: msg}, ok } */
  function validate() {
    const errors = {};
    if (!draft.title) errors['ed-title'] = t('val.titleRequired');
    if (!isValidDate(draft.date)) errors['ed-date'] = t('val.date');
    if (!TIME_RE.test(draft.start)) errors['ed-start'] = t('val.time');
    if (!TIME_RE.test(draft.end)) errors['ed-end'] = t('val.time');
    if (!errors['ed-start'] && !errors['ed-end']) {
      const a = toMin(draft.start), b = toMin(draft.end);
      if (b === a) errors['ed-end'] = t('val.zeroLength');
      else if (b < a && !s.allowOvernight) errors['ed-end'] = t('val.endAfterStart');
    }
    return { errors, ok: Object.keys(errors).length === 0 };
  }
  function showErrors(errors) {
    h.el.querySelectorAll('.err-text').forEach(el => { el.textContent = ''; });
    h.el.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
    for (const [id, msg] of Object.entries(errors)) {
      const el = $('#' + id); const er = $('#' + id + '-err');
      if (el) { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', id + '-err'); }

  }
  function recBody() {
    const box = $('#ed-rec-body');
    if (rec.mode === 'none') { box.innerHTML = `<p class="small muted" style="margin:0">${esc(isNew ? t('rec.noneHint') : t('rec.copiesHint'))}</p>`; return; }
    if (rec.mode === 'weekdays') {
      box.innerHTML = `<div class="chips" role="group" aria-label="${esc(t('rec.weekdays'))}">${[0, 1, 2, 3, 4, 5, 6].map(i => `<label class="chip-check"><input type="checkbox" data-rec-wd="${i}" ${rec.weekdays.includes(i) ? 'checked' : ''}> ${esc(weekdayName(i, 'short'))}</label>`).join('')}</div>
        <div class="btn-row" style="margin-top:8px"><label class="small" for="ed-rec-from">${esc(t('tbl.from'))}</label><input type="date" id="ed-rec-from" value="${esc(rec.from)}"><label class="small" for="ed-rec-to">${esc(t('tbl.to'))}</label><input type="date" id="ed-rec-to" value="${esc(rec.to)}"></div>`;
    } else {
      box.innerHTML = `<div class="chips" role="group" aria-label="${esc(t('rec.dates'))}">${marketDates().map(d => `<label class="chip-check"><input type="checkbox" data-rec-date="${d}" ${rec.dates.includes(d) ? 'checked' : ''}> ${esc(fmtDateMed(d))}</label>`).join('')}</div>`;
    }
    box.innerHTML += `<div class="field check" style="margin-top:8px"><input type="checkbox" id="ed-rec-skip" ${rec.skipConflicts ? 'checked' : ''}><label for="ed-rec-skip">${esc(t('rec.skip'))}</label></div>
      <div class="small" style="margin:6px 0 4px;font-weight:700" id="ed-rec-summary"></div><div class="rec-preview" id="ed-rec-preview"></div>`;
  }
  /** Dates (other than the draft's own date) that copies would be created on, with checks. */
  function recPlan() {
    if (rec.mode === 'none') return [];
    let ds = [];
    if (rec.mode === 'weekdays') ds = dateRange(rec.from, rec.to).filter(d => rec.weekdays.includes(weekdayOf(d)));
    else ds = [...rec.dates].sort();
    ds = ds.filter(d => d !== draft.date);
    return ds.map(d => {
      const copy = Object.assign(deepClone(draft), { id: '__preview_' + d, date: d });
      const day = getDayInfo(d);
      const cfs = previewConflictsFor(copy);
      const clash = cfs.filter(c => c.type === 'resource');
      const notes = [];
      if (!day.inMarket) notes.push(t('rec.outsideMarket'));
      else if (day.closed) notes.push(t('hours.closed'));
      else if (cfs.some(c => c.type === 'hours')) notes.push(t('rec.outsideHours', { h: hoursText(day) }));
      if (clash.length) notes.push(t('rec.clash', { n: clash.length }));

  }
  function refresh() {
    readForm();
    // type-dependent selects
    const catSel = $('#ed-category'), resSel = $('#ed-resource');
    if (catSel.dataset.type !== draft.type) {
      if (draft.categoryId && !state.categories.some(c => c.id === draft.categoryId && (c.type === draft.type || c.type === 'both'))) draft.categoryId = '';
      if (draft.type === 'stage' && !draft.resourceId) draft.resourceId = stages()[0]?.id || '';
