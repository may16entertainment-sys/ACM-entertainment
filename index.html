    }
    // duration + day info
    const okTimes = TIME_RE.test(draft.start) && TIME_RE.test(draft.end) && draft.start !== draft.end && (toMin(draft.end) > toMin(draft.start) || s.allowOvernight);
    $('#ed-duration').textContent = okTimes ? fmtDur(evDuration(draft)) : '—';
    $('#ed-dayinfo').innerHTML = isValidDate(draft.date) ? `${esc(fmtWeekday(draft.date))} · ${esc(t('tl.hours'))}: ${hoursHTML(getDayInfo(draft.date))}` : '';
    // warnings
    const { errors } = validate();
    const wbox = $('#ed-warnings');
    if (Object.keys(errors).length || !okTimes || !isValidDate(draft.date)) { wbox.innerHTML = ''; }
    else {
      const cfs = previewConflictsFor(draft);
      wbox.innerHTML = cfs.length ? cfs.map(c => `<div class="ed-warn ${c.ack ? 'ok' : c.severity}"><span>${c.ack ? '✓' : '⚠'}</span><span style="flex:1"><strong>${esc(t('ctype.' + c.type))}:</strong> ${esc(conflictReason(c))}${c.ack && c.ack.note ? ' — ' + u(c.ack.note) : ''}</span>${c.ack ? '' : `<button type="button" class="btn sm" data-ed-ack="${esc(c.key)}">${esc(t('conf.ack'))}</button>`}</div>`).join('')
        : `<div class="ed-warn ok">✓ ${esc(t('ed.noWarnings'))}</div>`;
    }
    // recurrence preview
    if (rec.mode !== 'none' && $('#ed-rec-preview')) {
      const plan = recPlan();
      const n = plan.filter(p => !p.skip).length;
      $('#ed-rec-summary').textContent = isNew ? t('rec.summaryNew', { n: n + 1 }) : t('rec.summaryCopies', { n });
      $('#ed-rec-preview').innerHTML = (isNew && isValidDate(draft.date) ? `<div>✓ <strong>${esc(fmtDateMed(draft.date))}</strong> <span class="muted">${esc(t('rec.thisEvent'))}</span></div>` : '') +
        (plan.length ? plan.map(p => `<div>${p.skip ? '⊘' : '＋'} <strong>${esc(fmtDateMed(p.d))}</strong>${p.notes.length ? ` <span class="${p.clash ? 'warn-icon' : 'muted'}">${esc(p.notes.join(' · '))}</span>` : ''}${p.skip ? ` <span class="muted">(${esc(t('rec.skipped'))})</span>` : ''}</div>`).join('') : `<div class="muted">${esc(t('rec.noDates'))}</div>`);
    }
  }
  // initial
  $('#ed-category').dataset.type = draft.type;
  recBody(); refresh();
  // events
  h.el.addEventListener('input', e => {
    if (e.target.matches('[data-rec-wd]')) { const i = Number(e.target.dataset.recWd); rec.weekdays = e.target.checked ? [...new Set([...rec.weekdays, i])] : rec.weekdays.filter(x => x !== i); }
    if (e.target.matches('[data-rec-date]')) { const d = e.target.dataset.recDate; rec.dates = e.target.checked ? [...new Set([...rec.dates, d])] : rec.dates.filter(x => x !== d); }
    if (e.target.id === 'ed-rec-from') rec.from = e.target.value;
    if (e.target.id === 'ed-rec-to') rec.to = e.target.value;
    if (e.target.id === 'ed-rec-skip') rec.skipConflicts = e.target.checked;
    if (e.target.name === 'ed-rec') { rec.mode = e.target.value; recBody(); }
    if (e.target.id === 'ed-performer') {
      const p = lookup.perf(e.target.value);
      if (p && !$('#ed-contactName').value && !$('#ed-contact').value) { $('#ed-contactName').value = p.contactName || ''; $('#ed-contact').value = p.contact || ''; }
    }
    refresh();
  });
  h.el.addEventListener('change', e => { if (e.target.matches('select,input[type=date],input[type=time]')) refresh(); });
  h.el.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edAck) {
      const note = await promptDialog({ title: t('conf.ackTitle'), message: esc(t('conf.ackMsg')), label: t('conf.ackNote') });
      if (note === null) return;
      commit('ack', st => { st.acks[b.dataset.edAck] = { note: note.trim(), at: new Date().toISOString() }; });
      refresh();
    }
    if (b.id === 'ed-new-perf') {
      const name = await promptDialog({ title: t('ed.newPerformer'), label: t('field.performerName'), multiline: false });
      if (!name || !name.trim()) return;
      const p = { id: uid('pf'), name: name.trim(), kind: draft.type, contactName: '', contact: '', notes: '', demo: false };
      commit('add performer', st => { st.performers.push(p); });
      readForm(); draft.performerId = p.id; $('#ed-performer').innerHTML = perfOptions(); refresh();
    }
    if (b.id === 'ed-save') doSave();
    if (b.id === 'ed-delete') {
      const ok = await confirmDialog({ title: t('del.title'), message: esc(t('del.msg', { title: existing.title, date: fmtDateLong(existing.date) })), ok: t('act.delete'), danger: true });
      if (!ok) return;
      commit('delete', st => { st.events = st.events.filter(x => x.id !== existing.id); });
      saved = true; h.close(true); undoToast(t('toast.deleted', { title: existing.title }));
    }
    if (b.id === 'ed-cancel-appearance') {
      readForm();
      const v = validate(); if (!v.ok) { showErrors(v.errors); return; }
      if (draft.status === 'cancelled') { draft.status = draft.prevStatus && draft.prevStatus !== 'cancelled' ? draft.prevStatus : 'proposed'; }
      else { draft.prevStatus = draft.status; draft.status = 'cancelled'; }
      const st2 = draft.status;
      commit('cancel/restore', st => { const i = st.events.findIndex(x => x.id === draft.id); draft.updatedAt = new Date().toISOString(); st.events[i] = deepClone(draft); });
      saved = true; h.close(true);
      undoToast(st2 === 'cancelled' ? t('toast.cancelled', { title: draft.title }) : t('toast.restored', { title: draft.title }));
    }
    if (b.id === 'ed-duplicate') {
      readForm();
      const copy = Object.assign(deepClone(draft), { id: uid('ev'), createdAt: new Date().toISOString(), seriesId: draft.seriesId || '' });
      const dirty = JSON.stringify(draft) !== original;
      if (dirty && !(await confirmDialog({ title: t('ed.discardTitle'), message: esc(t('ed.dupDiscard')), ok: t('act.duplicate') }))) return;
      saved = true; await h.close(true);
      openEditor(null, Object.assign(copy, { __dup: true }));
      toast(t('toast.dupOpened'));
    }
  });
  h.el.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doSave(); }
  });
  function doSave() {
    readForm();
    const v = validate();
    showErrors(v.errors);
    if (!v.ok) { const first = $('[aria-invalid="true"]'); if (first) { const det = first.closest('details'); if (det) det.open = true; first.focus(); } return; }
    delete draft.__dup;
    const plan = recPlan().filter(p => !p.skip);
    const seriesId = plan.length ? (draft.seriesId || uid('series')) : draft.seriesId;
    draft.updatedAt = new Date().toISOString();
    if (plan.length) draft.seriesId = seriesId;
    const created = plan.map(p => Object.assign(deepClone(draft), { id: uid('ev'), date: p.d, seriesId, createdAt: new Date().toISOString() }));
    commit(isNew ? 'create' : 'edit', st => {
      if (isNew) st.events.push(deepClone(draft));
      else { const i = st.events.findIndex(x => x.id === draft.id); if (i === -1) throw new Error('Event no longer exists'); st.events[i] = deepClone(draft); }
      st.events.push(...created);
    });
    saved = true;
    h.close(true);
    const nW = eventConflicts(draft.id).filter(c => !c.ack).length;
    const msg = (isNew ? t('toast.created', { title: draft.title }) : t('toast.saved', { title: draft.title })) + (created.length ? ' ' + t('toast.plusCopies', { n: created.length }) : '') + (nW ? ' ' + t('toast.withWarnings', { n: nW }) : '');
    undoToast(msg, nW ? 'warn' : '');
  }
}

/* Quick actions used by table and other views */
async function deleteEventConfirm(id) {
  const e = lookup.ev(id); if (!e) return;
  const ok = await confirmDialog({ title: t('del.title'), message: esc(t('del.msg', { title: e.title, date: fmtDateLong(e.date) })), ok: t('act.delete'), danger: true });
  if (!ok) return;
  commit('delete', st => { st.events = st.events.filter(x => x.id !== id); });
  undoToast(t('toast.deleted', { title: e.title }));
}
function duplicateEvent(id) {
  const e = lookup.ev(id); if (!e) return;
  const copy = Object.assign(deepClone(e), { id: uid('ev'), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  commit('duplicate', st => { st.events.push(copy); });
  undoToast(t('toast.duplicated', { title: e.title }));
  return copy.id;
}

/* ==========================================================================
   SETTINGS view: market dates, weekly hours, date overrides & special dates,
   stages, categories, performers, rules, coverage, data.
   Every control commits immediately through `commit` (auto-saved, undoable).
   ========================================================================== */
let _restorePointsCache = null;

/* ==========================================================================
   FIREBASE SHARED MODE (GitHub Pages / any web host)
   - firebase-config.js sets window.FIREBASE_CONFIG. Without it the page is
     the offline, this-browser-only scheduler.
   - Each shared schedule has a long random id carried in the link (?s=<id>).
     Anyone with the link can view (they are signed in anonymously, no account).
   - Editing needs an email + password account that an admin of this schedule
     has added in the Editors tab (boards/<id>/members/<email>), or the owner
     (FB_OWNER), who is admin of every schedule. Google sign-in works for anyone
     whose Google email is on the list. firestore.rules
     check that membership on every write; removing someone ends their editing
     at once.
   - Each document is stored as { json: "<text>" } so the app's data shape
     never has to fit Firestore's field rules.
   ========================================================================== */
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

const FB_OWNER = 'may16entertainment@gmail.com';
const FB = {
  m: null, app: null, auth: null, fs: null, board: null, role: null, leaving: false, members: [], membersUnsub: null,
  configured() { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && c.projectId && !/PASTE|YOUR_/i.test(c.apiKey + c.projectId)); },
  boardFromUrl() { const v = new URLSearchParams(location.search).get('s'); return v ? (/^[A-Za-z0-9_-]{16,64}$/.test(v) ? v : 'bad') : null; },
  active() { return !IS_ARTIFACT && this.configured() && !!this.board && this.board !== 'bad'; },
  isAdmin() { return this.role === 'admin'; },
  /** Signed in as the owner with a verified email (Google sign-in is always verified). */
  isOwner() { const u = this.auth && this.auth.currentUser; return !!(u && !u.isAnonymous && u.emailVerified && this.cleanEmail(u.email) === FB_OWNER); },
  newId() { const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  suggestPassword() {
    const words = ['cedar', 'lantern', 'olive', 'citadel', 'amber', 'desert', 'garnet', 'harbor', 'jasmine', 'maple', 'meadow', 'orchid', 'pepper', 'saffron', 'silver', 'thyme', 'velvet', 'willow', 'zephyr', 'falcon', 'granite', 'hazel', 'ivory', 'juniper', 'kestrel', 'lotus', 'marble', 'nutmeg', 'opal', 'pebble', 'quartz', 'raven', 'sesame', 'tulip', 'umber', 'walnut', 'canyon', 'comet', 'ember', 'frost', 'glacier', 'honey', 'indigo', 'jade', 'lilac', 'mosaic', 'nectar', 'oasis'];
    const r = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
    const w = () => { const x = words[r(words.length)]; return x[0].toUpperCase() + x.slice(1); };

  cleanEmail(e) { return String(e || '').trim().toLowerCase(); },
  validEmail(e) { return /^[^\s@/]+@[^\s@/]+\.[^\s@/]+$/.test(e) && e.length <= 200; },

    if (/email-already-in-use/.test(c)) return 'exists';
    if (/weak-password/.test(c)) return 'weak';
    if (/invalid-email/.test(c)) return 'email';
    if (/too-many-requests/.test(c)) return 'many';
    if (/network/.test(c)) return 'net';
    if (/operation-not-allowed|admin-restricted/.test(c)) return 'disabled';
    if (/popup-closed-by-user|cancelled-popup-request|user-cancelled/.test(c)) return 'cancel';

  async load() {

  async open() {

      delete: () => m.deleteDoc(ref).catch(e => { throw this.err(e); })

      doc: path => docApi(this.ref('boards', b, ...path.split('/'))),

  /** Look up this person's role on this schedule: 'admin', 'editor' or null. */

  watchMembers() {

  async authWithEmail(email, password) {

      const emu = window.FIREBASE_EMULATOR; if (emu) m.connectAuthEmulator(auth2, `http://${emu.host}:${emu.authPort}`, { disableWarnings: true });

}
async function copyText(text, fallbackInput) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    (fallbackInput || document.body).appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove(); return ok;
  }
}

    ${fieldHTML('fb-pw', t('fb.password'), 'password', 'autocomplete="current-password" dir="ltr"')}

    <button type="button" class="btn primary" id="fb-go" style="width:100%;justify-content:center;padding:9px">${esc(t('fb.signInBtn'))}</button>
    <p style="text-align:center;margin:8px 0 0"><button type="button" class="btn sm ghost" id="fb-forgot">${esc(t('fb.forgot'))}</button></p>
    <p class="small muted" style="text-align:center;margin:14px 0 0;border-top:1px solid var(--line-2);padding-top:12px">${esc(t('fb.viewersHint'))}</p>`);
  const $a = sel => document.querySelector('#app ' + sel), err = $a('#fb-err');
  const after = r => { if (r === 'ok') renderLanding(msgKey); else if (r !== 'cancel') { err.style.color = 'var(--danger)'; err.textContent = fbReasonText(r); } };
  $a('#fb-google').addEventListener('click', async () => { err.textContent = ''; $a('#fb-google').disabled = true; const r = await FB.authWithGoogle(); $a('#fb-google').disabled = false; after(r); });
  const submit = async () => {
    const em = FB.cleanEmail($a('#fb-em').value), pw = $a('#fb-pw').value;
    if (!em || !pw) { (em ? $a('#fb-pw') : $a('#fb-em')).focus(); return; }
    err.textContent = ''; $a('#fb-go').disabled = true;
    const r = await FB.authWithEmail(em, pw); $a('#fb-go').disabled = false; after(r);
  };
  $a('#fb-go').addEventListener('click', submit);
  document.querySelectorAll('#app input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }));
  $a('#fb-forgot').addEventListener('click', async () => {
    const em = FB.cleanEmail($a('#fb-em').value);
    if (!FB.validEmail(em)) { err.style.color = 'var(--danger)'; err.textContent = t('fb.forgotNeedEmail'); $a('#fb-em').focus(); return; }
    try { await FB.resetPassword(em); err.style.color = 'var(--ok)'; err.textContent = t('fb.resetSent', { email: em }); }
    catch (e) { err.style.color = 'var(--danger)'; err.textContent = fbReasonText(FB.authReason(e), e.message); }
  });
}

/** Settings change handler (delegated from app.js on 'change'). Returns true if handled. */
function handleSettingsChange(el) {
  const s = state.settings;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'marketStart' || k === 'marketEnd') {
      if (!isValidDate(v)) { toast(t('val.date'), { type: 'error' }); render(); return true; }
      const ns = k === 'marketStart' ? v : s.marketStart, ne = k === 'marketEnd' ? v : s.marketEnd;
      if (ns > ne) { toast(t('val.rangeOrder'), { type: 'error' }); render(); return true; }
      if (daysBetween(ns, ne) > 366) { toast(t('val.rangeTooLong'), { type: 'error' }); render(); return true; }
    }
    if (k === 'language') { state.settings.language = v; setLanguagePref(v); stateVersion++; if (!Cloud.active) markDirty(); render(); toast(t('toast.langChanged')); return true; }

  if (!ok) return;

/* ==========================================================================
   EXPORTS: CSV (UTF-8 with BOM), print / Save-as-PDF reports, JSON backup.
   No external libraries: PDF output uses the browser's own print dialog.
   ========================================================================== */

/* ---------- CSV ---------- */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=@]/.test(s)) s = "'" + s; // neutralise spreadsheet formulas
  return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCSV(events) {
  const cols = [
    ['csv.id', e => e.id], ['field.date', e => e.date], ['col.day', e => fmtWeekday(e.date)],
    ['field.start', e => e.start], ['field.end', e => e.end], ['csv.durationMin', e => evDuration(e)],
    ['field.title', e => e.title], ['field.type', e => t('type.' + e.type)], ['field.category', e => e.categoryId ? catName(e.categoryId) : ''],
    ['field.performer', e => perfName(e.performerId)], ['field.resource', e => e.type === 'roaming' ? t('misc.roamingMarket') : (e.resourceId ? resName(e.resourceId) : '')],
    ['field.status', e => t('status.' + e.status)], ['field.priority', e => t('prio.' + e.priority)],
    ['field.contactName', e => e.contactName], ['field.contact', e => e.contact],
    ['field.setupMin', e => e.setupMin || 0], ['field.soundcheckMin', e => e.soundcheckMin || 0], ['field.changeoverMin', e => e.changeoverMin || 0], ['field.breakMin', e => e.breakMin || 0],
    ['field.tech', e => e.tech], ['field.prodNotes', e => e.prodNotes], ['field.internalNotes', e => e.internalNotes],
    ['field.specialEvent', e => e.specialEvent], ['field.fee', e => e.fee],
    ['csv.demo', e => e.demo ? 'DEMO — NOT A REAL BOOKING' : ''],
    ['col.conflicts', e => eventConflicts(e.id).map(c => (c.ack ? '[' + t('ctype.intentional') + '] ' : '') + conflictReason(c)).join(' | ')]
  ];
  const sorted = [...events].sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start) || resName(a.resourceId).localeCompare(resName(b.resourceId)));
  const lines = [cols.map(c => csvCell(t(c[0]))).join(',')];
  for (const e of sorted) lines.push(cols.map(c => csvCell(c[1](e))).join(','));
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function exportCSV(scope, opts = {}) {
  let evs, name;
  if (scope === 'all') { evs = state.events; name = 'all'; }
  else if (scope === 'range') {
    if (!isValidDate(opts.from) || !isValidDate(opts.to) || opts.from > opts.to) { toast(t('val.rangeOrder'), { type: 'error' }); return false; }
    evs = state.events.filter(e => e.date >= opts.from && e.date <= opts.to); name = opts.from + '_to_' + opts.to;
  }
  else if (scope === 'day') { if (!isValidDate(opts.date)) { toast(t('val.date'), { type: 'error' }); return false; } evs = state.events.filter(e => e.date === opts.date); name = opts.date; }
  else { evs = tableRows(); name = 'filtered'; }
  download(`amman-market-schedule-${name}-${fileStamp()}.csv`, buildCSV(evs), 'text/csv;charset=utf-8');
  toast(t('csv.done', { n: evs.length }));
  return true;
}

}
function printEvents(evs, applyFilters) { return applyFilters ? evs.filter(matchesFilters) : evs; }
function reportROS(date, applyFilters) {

      </div></div>`;

  return `<div class="p-page">${printHeader(t('ros.title'), sub)}${evs.length ? `<div class="p-ros">${items}</div>` : `<p>${esc(t('ros.empty'))}</p>`}</div>`;

function reportTimeline(date, applyFilters) {
  const day = getDayInfo(date);
  const evs = printEvents(eventsOn(date), applyFilters);
  let rs, re;
  if (!day.closed) { rs = day.open; re = day.close; } else { rs = 960; re = 1380; }
  evs.forEach(e => { rs = Math.min(rs, evStart(e)); re = Math.max(re, evEnd(e)); });
  rs = Math.floor(rs / 60) * 60; re = Math.ceil(re / 60) * 60;
  const P = m => ((m - rs) / (re - rs) * 100).toFixed(3) + '%';
  const W = (a, b) => ((b - a) / (re - rs) * 100).toFixed(3) + '%';
  let ticks = ''; for (let m = rs; m <= re; m += 60) ticks += `<div class="tick" style="inset-inline-start:${P(m)}"><span>${esc(fmtHourLabel(m))}</span></div>`;
  const closedBg = day.closed ? `<div class="closed" style="inset-inline-start:0;width:100%"></div>` : `<div class="closed" style="inset-inline-start:0;width:${W(rs, day.open)}"></div><div class="closed" style="inset-inline-start:${P(day.close)};width:${W(day.close, re)}"></div>`;
  const rowsSrc = [...stages().map(r => ({ r, evs: evs.filter(e => e.resourceId === r.id) }))];
  const un = evs.filter(e => e.type === 'stage' && (!e.resourceId || !lookup.res(e.resourceId))); if (un.length) rowsSrc.push({ r: { nameEn: t('misc.unassigned'), nameAr: t('misc.unassigned') }, evs: un });
  // roaming acts: one row per group
  const roam = evs.filter(e => e.type === 'roaming');
  [...new Set(roam.map(e => e.performerId))].sort((a, b) => perfName(a).localeCompare(perfName(b))).forEach(pid => rowsSrc.push({ r: { nameEn: '⟲ ' + (pid ? perfName(pid) : t('tl.noPerformer')) }, evs: roam.filter(e => e.performerId === pid) }));
  const LH = 42;
  const rows = rowsSrc.map(row => {
    const items = row.evs.map(e => ({ e, s: evStart(e), en: evEnd(e) }));
    const n = assignLanes(items);
    return `<div class="row"><div class="lab">${u(dname(row.r))}</div><div class="trk" style="height:${n * (LH + 2) + 4}px">${closedBg}${ticks.replace(/<span>.*?<\/span>/g, '')}
      ${items.map(it => `<div class="blk ${it.e.type === 'roaming' ? 'roam' : ''}" style="--c:${esc(catColor(it.e.categoryId))};inset-inline-start:${P(it.s)};width:${W(it.s, it.en)};top:${2 + it.lane * (LH + 2)}px;height:${LH}px"><b>${u(it.e.title)}</b>${esc(fmtRangeText(it.s, it.en))}${it.e.demo ? ' · DEMO' : ''}</div>`).join('')}</div></div>`;
  }).join('');

function reportMonth(first, applyFilters) {

  while (cells.length > 35 && parseDate(cells[cells.length - 7]).getUTCMonth() !== monthIdx) cells.splice(-7);
  const MAX = 7;
  return `<div class="p-page">${printHeader(t('print.month'), esc(fmtMonthYear(first)))}
    <div class="p-month">${[0, 1, 2, 3, 4, 5, 6].map(i => `<div class="dow">${esc(weekdayName(i, 'long'))}</div>`).join('')}
    ${cells.map(d => {
      const day = getDayInfo(d); const inMonth = parseDate(d).getUTCMonth() === monthIdx;
      const evs = printEvents(eventsOn(d), applyFilters).sort((a, b) => evStart(a) - evStart(b));
      return `<div class="c ${!inMonth || !day.inMarket ? 'out' : ''}"><div class="n">${esc(fmtDate(d, { day: 'numeric' }))}${day.special ? ' ★' : ''}</div>

        ${evs.length > MAX ? `<div class="h">${esc(t('month.more', { n: evs.length - MAX }))}</div>` : ''}
        ${day.inMarket && !day.closed && !evs.length ? `<div class="h"><i>${esc(t('cov.short.none'))}</i></div>` : ''}</div>`;
    }).join('')}</div><div class="p-foot">▣ ${esc(t('type.stage'))} · ⟲ ${esc(t('type.roaming'))} · ★ ${esc(t('legend.special'))}</div></div>`;
}
function reportMaster(from, to, applyFilters) {

/** Build the requested report into #print-root and set page orientation. Returns the HTML (used by tests too). */
function buildPrint(kind, opts = {}) {
  let html = '', orient = 'landscape';
  if (kind === 'ros') { html = reportROS(opts.date, opts.applyFilters); orient = 'portrait'; }
  else if (kind === 'timeline') html = reportTimeline(opts.date, opts.applyFilters);
  else if (kind === 'month') html = (opts.months || []).map(m => reportMonth(m, opts.applyFilters)).join('');
  else if (kind === 'master') html = reportMaster(opts.from, opts.to, opts.applyFilters);
  document.getElementById('print-root').innerHTML = html;

}
function doPrint(kind, opts) {

  if (IS_ARTIFACT) { savePrintableFile(kind, opts); return; }
  buildPrint(kind, opts);
  setTimeout(() => { try { window.print(); } catch (e) { toast(t('print.failed'), { type: 'error' }); } }, 50);
}
/** Inside a published Artifact the print dialog is unavailable, so the report is saved as a

function savePrintableFile(kind, opts) {
  const body = buildPrint(kind, opts);
  const orient = document.getElementById('page-style').textContent;
  const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
  const html = `<!doctype html><html lang="${lang()}" dir="${isRTL() ? 'rtl' : 'ltr'}"><head><meta charset="utf-8"><title>${esc(t('print.' + kind))}</title>
<style>${css}\n#print-root{display:block;padding:12px}@media print{#print-root{padding:0}}${orient}</style></head>
<body><div id="print-root">${body}</div><script>window.addEventListener('load',function(){setTimeout(function(){window.print()},300)});<\/script></body></html>`;
  document.getElementById('print-root').innerHTML = '';

}

function exportBackup() {
  state.meta.lastBackupAt = new Date().toISOString(); markDirty();
  download(`amman-market-schedule-backup-${fileStamp()}.json`, JSON.stringify(makeBackup(), null, 2), 'application/json');

function importBackupFile(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { alertDialog(t('backup.invalid'), `<p>${esc(t('backup.tooLarge'))}</p>`); return; }
  const reader = new FileReader();
  reader.onerror = () => alertDialog(t('backup.invalid'), `<p>${esc(t('backup.readFail'))}</p>`);
  reader.onload = async () => {
    const res = parseBackup(String(reader.result));
    if (!res.ok) { await alertDialog(t('backup.invalid'), `<p>${esc(t('backup.rejected'))}</p><ul class="small">${res.errors.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="small muted">${esc(t('backup.unchanged'))}</p>`); return; }
    const d = res.data;
    const dates = d.events.map(e => e.date).sort();
    const summary = `<ul class="small">
      <li>${esc(t('backup.file'))}: <strong>${esc(file.name)}</strong></li>
      <li>${esc(t('backup.exportedAt'))}: ${esc(res.backup.exportedAt ? new Date(res.backup.exportedAt).toLocaleString(locale()) : '?')}</li>
      <li>${esc(t('backup.market'))}: ${esc(fmtDateLong(d.settings.marketStart))} – ${esc(fmtDateLong(d.settings.marketEnd))}</li>
      <li>${esc(t('backup.counts', { e: d.events.length, demo: d.events.filter(e => e.demo).length, p: d.performers.length, r: d.resources.length, c: d.categories.length, o: Object.keys(d.settings.dateOverrides).length }))}</li>
      ${dates.length ? `<li>${esc(t('backup.eventRange', { a: fmtDateMed(dates[0]), b: fmtDateMed(dates[dates.length - 1]) }))}</li>` : ''}</ul>
      ${res.warnings.length ? `<div class="banner warn small"><div class="grow">${esc(t('backup.warnings'))}<ul>${res.warnings.slice(0, 8).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div></div>` : ''}
      <div class="banner danger small"><div class="grow">${esc(t('backup.replaceWarn', { n: state.events.length }) + (Cloud.active ? ' ' + t('cloud.replaceAll') : ''))}</div></div>`;
    const ok = await confirmDialog({ title: t('backup.confirmTitle'), message: summary, ok: t('backup.replace'), danger: true });
    if (!ok) { toast(t('backup.cancelled')); return; }
    try {
      await addRestorePoint(t('rp.beforeImport')); refreshRestorePoints();
      replaceState(d); await saveNow();
      toast(t('backup.imported', { n: d.events.length }));
    } catch (e) { alertDialog(t('err.title'), `<p>${esc(e.message)}</p>`); }
  };
  reader.readAsText(file, 'utf-8');
}

  const raw = d.inWeek ? dy / ppm : (isRTL() ? -dx : dx) / ppm;

    const ctx = TL.ctx;

    d.blk.style.width = Math.max(6, Math.round((ne - ns) * ctx.ppm)) + 'px';

  if (ne - ns < 5) return;
  applyMove(id, { ns, ne, resourceId: e.resourceId, date: e.date }, true);
  requestAnimationFrame(() => { const el = document.querySelector(`#main .evb[data-ev="${CSS.escape(id)}"]:not([data-ghost])`); if (el) el.focus(); });
  const x = lookup.ev(id); if (x) announce(`${x.title}: ${fmtRangeText(evStart(x), evEnd(x))}`);
}
function announce(msg) { const el = document.getElementById('sr-live'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); } }

/* ---------- Click-to-create on empty timeline / week slots ---------- */
function slotFromTrack(track, clientX) {
  const rect = track.getBoundingClientRect();
  const x = isRTL() ? rect.right - clientX : clientX - rect.left;
  return Math.floor((TL.ctx.rs + x / TL.ctx.ppm) / 15) * 15;
}
function slotFromWeek(col, clientY) {
  const rect = col.getBoundingClientRect();
  return Math.floor((WK.ctx.rs + (clientY - rect.top) / WK.ctx.ppm) / 15) * 15;
}
function createAt(date, startMin, extra) {
  const type = extra.type || 'stage';
  const dur = type === 'roaming' ? state.settings.defaultRoamingDuration : state.settings.defaultStageDuration;
  const s = clamp(startMin, 0, 1440 - 15);
  const e = Math.min(s + dur, 1440 - (state.settings.allowOvernight ? 0 : 5));
  openEditor(null, Object.assign({ date, start: fromMin(s), end: fromMin(e > s ? e : s + 15) }, extra));
}

/* ---------- Inline table editing ---------- */
function inlineEdit(el) {
  const e = lookup.ev(el.dataset.id); if (!e) return;
  const f = el.dataset.inline; let v = el.value;
  if (f === 'title') { v = v.trim(); if (!v) { toast(t('val.titleRequired'), { type: 'error' }); render(); return; } }
  if (f === 'date' && !isValidDate(v)) { toast(t('val.date'), { type: 'error' }); render(); return; }
  if ((f === 'start' || f === 'end')) {
    if (!TIME_RE.test(v)) { toast(t('val.time'), { type: 'error' }); render(); return; }
    const s = f === 'start' ? toMin(v) : toMin(e.start), en = f === 'end' ? toMin(v) : toMin(e.end);
    if (s === en || (en < s && !state.settings.allowOvernight)) { toast(t('val.endAfterStart'), { type: 'error' }); render(); return; }
  }
  if (f === 'status' && !STATUSES.includes(v)) return;
  commit('inline ' + f, st => {
    const x = st.events.find(y => y.id === e.id);
    if (f === 'status' && v === 'cancelled' && x.status !== 'cancelled') x.prevStatus = x.status;
    x[f] = v; x.updatedAt = new Date().toISOString();
  });
  undoToast(f === 'date' ? t('toast.movedDate', { title: e.title, date: fmtDateLong(v) }) : t('toast.saved', { title: f === 'title' ? v : e.title }));
}

/* ---------- Acknowledgements ---------- */
async function acknowledge(key, existingNote) {
  const note = await promptDialog({ title: t('conf.ackTitle'), message: esc(t('conf.ackMsg')), label: t('conf.ackNote'), value: existingNote || '' });
  if (note === null) return;
  commit('acknowledge', st => { st.acks[key] = { note: note.trim(), at: (st.acks[key] && st.acks[key].at) || new Date().toISOString() }; });
  toast(t('conf.acked'));
}

/* ---------- Delegated event handlers ---------- */
let _searchTimer = null;
document.addEventListener('click', async ev => {
  if (!state) return;
  if (ev.target.closest('#modal-root') || ev.target.closest('#toast-root')) return; // modals manage their own clicks
  const b = ev.target.closest('button, [data-day], [data-go-day], .evb[data-ev], .tl-track, .wk-day, a[data-set-nav]');
  if (!b) { if (ui.table.colMenu) { ui.table.colMenu = false; render(); } return; }
  const d = b.dataset;
  if (ui.table.colMenu && !ev.target.closest('.col-picker')) { ui.table.colMenu = false; render(); return; }
  // --- navigation
  if (d.nav) { ui.view = d.nav; saveUI(); render(); document.getElementById('main').focus({ preventScroll: true }); window.scrollTo(0, 0); return; }
  if (d.lang) { if (state.settings.language !== d.lang) { state.settings.language = d.lang; setLanguagePref(d.lang); stateVersion++; if (!Cloud.active) markDirty(); render(); } return; }
  if (d.openEv) { openEditor(d.openEv); return; }
  if (d.goDay) { setDate(d.goDay, 'day'); return; }
  if (d.dashDate) { ui.date = d.dashDate; ui.monthCursor = d.dashDate.slice(0, 8) + '01'; saveUI(); render(); return; }
  if (d.month) { ui.monthCursor = d.month; render(); return; }
  if (d.week) { setDate(addDays(ui.date, 7 * Number(d.week))); return; }
  if (d.collapse) { ui.tl.collapsed[d.collapse] = !ui.tl.collapsed[d.collapse]; saveUI(); render(); return; }
  if (d.density) { ui.tl.density = d.density; saveUI(); render(); return; }
  if (d.wdensity) { ui.week.density = d.wdensity; saveUI(); render(); return; }
  if (d.zoom !== undefined) { const z = Number(d.zoom); ui.tl.zoom = z === 0 ? 1 : clamp(Math.round((ui.tl.zoom + z * 0.25) * 100) / 100, 0.5, 3); saveUI(); render(); return; }
  if (d.tmode) { ui.table.mode = d.tmode; saveUI(); render(); return; }
  if (d.sort) { if (ui.table.sortKey === d.sort) ui.table.sortDir *= -1; else { ui.table.sortKey = d.sort; ui.table.sortDir = 1; } saveUI(); render(); return; }
  if (d.dup) { duplicateEvent(d.dup); return; }
  if (d.del) { deleteEventConfirm(d.del); return; }
  if (d.cfEv) { const e = lookup.ev(d.cfEv); ui.conflicts = { date: e ? e.date : '', type: '', sev: '', ack: 'all' }; ui.view = 'conflicts'; render(); return; }
  if (d.ack) { acknowledge(d.ack); return; }
  if (d.ackEdit) { acknowledge(d.ackEdit, (state.acks[d.ackEdit] || {}).note); return; }
  if (d.unack) {
    if (!(await confirmDialog({ title: t('conf.unack'), message: esc(t('conf.unackMsg')), ok: t('conf.unack') }))) return;
    commit('unacknowledge', st => { delete st.acks[d.unack]; }); return;
  }
  // --- event blocks
  if (b.matches('.evb[data-ev]')) { if (suppressClick) return; openEditor(d.ev); return; }
  // --- empty-slot creation
  if (b.matches('.tl-track')) {
    if (suppressClick) return;
    const row = b.closest('.tl-row');
    if (row && row.classList.contains('collapsed')) { ui.tl.collapsed[row.dataset.row] = false; render(); return; }
    const m = slotFromTrack(b, ev.clientX);
    const kind = b.dataset.kind;
    if (kind === 'perf') createAt(TL.ctx.date, m, { type: 'roaming', performerId: b.dataset.perf || '', resourceId: '' });
    else createAt(TL.ctx.date, m, { type: 'stage', resourceId: b.dataset.res || '' });
    return;
  }
  if (b.matches('.wk-day')) { if (suppressClick) return; createAt(b.dataset.date, slotFromWeek(b, ev.clientY), { type: 'stage' }); return; }
  if (d.day) { setDate(d.day, 'day'); return; }
  // --- actions
  switch (d.act) {
    case 'date-prev': setDate(addDays(ui.date, -1)); return;
    case 'date-next': setDate(addDays(ui.date, 1)); return;
    case 'date-today': setDate(todayAmman()); return;
    case 'toggle-filters': ui.showFilters = !ui.showFilters; render(); return;
    case 'toggle-legend': ui.legendOpen = !ui.legendOpen; render(); return;
    case 'new-event': openEditor(null, { date: ui.date }); return;
    case 'open-export': openExportDialog(); return;
    case 'fb-signin': fbSignInDialog(); return;
    case 'fb-share': fbAccountDialog(); return;
    case 'undo': { const l = undo(); toast(l ? t('toast.undone') : t('toast.nothingUndo')); return; }
    case 'clear-filters': ui.filters = { q: '', cat: '', perf: '', res: '', status: '', type: '' }; render(); return;
    case 'remove-demo': removeDemoData(); return;
    case 'cloud-seed-demo': { const d = buildDemoData(); commit('seed demo', st => { st.performers.push(...d.performers.filter(p => !st.performers.some(x => x.id === p.id))); st.events.push(...d.events); Object.assign(st.settings.dateOverrides, d.overrides); st.meta.demoLoaded = true; }); return; }
    case 'export-backup': exportBackup(); return;
    case 'import-backup': document.getElementById('import-file').click(); return;
    case 'show-ros': ui.view = 'table'; ui.table.mode = 'ros'; saveUI(); render(); return;
    case 'expand-all': ui.tl.collapsed = {}; saveUI(); render(); return;
    case 'tbl-market': ui.table.from = state.settings.marketStart; ui.table.to = state.settings.marketEnd; render(); return;
    case 'tbl-clear-range': ui.table.from = ''; ui.table.to = ''; render(); return;
    case 'col-menu': ui.table.colMenu = !ui.table.colMenu; render(); return;
    case 'csv-filtered': exportCSV('filtered'); return;
    case 'csv-day': exportCSV('day', { date: ui.date }); return;
    case 'print-ros': doPrint('ros', { date: ui.date, applyFilters: filtersActive() }); return;
    case 'print-table': {
      const from = ui.table.from || state.settings.marketStart, to = ui.table.to || state.settings.marketEnd;
      doPrint('master', { from, to, applyFilters: filtersActive() }); return;
    }
  }
  if (ui.view === 'settings') { try { await handleSettingsClick(b); } catch (e) { console.error(e); toast(t('err.generic', { msg: e.message }), { type: 'error' }); } }
});
document.addEventListener('change', ev => {
  if (!state) return;
  const el = ev.target;
  if (el.closest('#modal-root')) return;
  if (el.id === 'import-file') { importBackupFile(el.files[0]); el.value = ''; return; }
  if (el.id === 'date-input') { if (isValidDate(el.value)) setDate(el.value); return; }
  if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; render(); return; }
  if (el.id === 'tbl-from') { ui.table.from = isValidDate(el.value) ? el.value : ''; render(); return; }
  if (el.id === 'tbl-to') { ui.table.to = isValidDate(el.value) ? el.value : ''; render(); return; }
  if (el.dataset.col) { const k = el.dataset.col; state.settings.tableColumns[k] = el.checked; stateVersion++; markDirty(); render(); return; }
  if (el.dataset.cf) { ui.conflicts[el.dataset.cf] = el.value; render(); return; }
  if (el.dataset.inline) { inlineEdit(el); return; }
  if (ui.view === 'settings') { try { handleSettingsChange(el); } catch (e) { console.error(e); toast(t('err.generic', { msg: e.message }), { type: 'error' }); render(); } }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'f-q') { clearTimeout(_searchTimer); const v = ev.target.value; _searchTimer = setTimeout(() => { ui.filters.q = v; render(); }, 220); }
});
document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('mousemove', ev => {
  // hover preview for click-to-create on the daily timeline
  const track = ev.target.closest && ev.target.closest('.tl-track');
  if (!track || drag || !TL.ctx || track.closest('.tl-row.collapsed')) return;
  const slot = track.querySelector('.hover-slot'); if (!slot) return;
  if (ev.target.closest('.evb')) { slot.style.display = 'none'; return; }
  slot.style.display = '';
  const m = slotFromTrack(track, ev.clientX);
  const dur = track.dataset.kind === 'stage' ? state.settings.defaultStageDuration : state.settings.defaultRoamingDuration;
  slot.style.insetInlineStart = Math.round((m - TL.ctx.rs) * TL.ctx.ppm) + 'px';
  slot.style.width = Math.round(dur * TL.ctx.ppm) + 'px';
  slot.title = t('tl.clickToAdd', { t: fmtTime(m) });
});
document.addEventListener('keydown', ev => {
  if (!state) return;
  const top = Modal.top();
  if (ev.key === 'Escape') { if (top) { ev.preventDefault(); top.close(); return; } if (ui.table.colMenu) { ui.table.colMenu = false; render(); return; } }
  if (top) return;
  const inField = ev.target.matches && ev.target.matches('input, textarea, select, [contenteditable]');
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !inField) { ev.preventDefault(); const l = undo(); toast(l ? t('toast.undone') : t('toast.nothingUndo')); return; }
  const blk = ev.target.closest && ev.target.closest('#main .evb[data-ev]');
  if (blk && !blk.dataset.ghost) {
    const id = blk.dataset.ev; const snap = Math.max(1, Number(state.settings.snapMin) || 5);
    const inWeek = !!blk.closest('.wk-day');
    const fwd = inWeek ? 'ArrowDown' : (isRTL() ? 'ArrowLeft' : 'ArrowRight');
    const back = inWeek ? 'ArrowUp' : (isRTL() ? 'ArrowRight' : 'ArrowLeft');
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEditor(id); return; }
    if (ev.key === fwd || ev.key === back) {
      ev.preventDefault(); const dir = ev.key === fwd ? 1 : -1;
      if (ev.shiftKey) nudge(id, 0, dir * snap); else nudge(id, dir * snap, dir * snap);
      return;
    }
    if (ev.key === 'Delete') { ev.preventDefault(); deleteEventConfirm(id); return; }
  } else if (blk && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openEditor(blk.dataset.ev); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches) {
    if (ev.target.matches('.mcell[data-day]')) { ev.preventDefault(); setDate(ev.target.dataset.day, 'day'); }
    else if (ev.target.matches('.wk-head[data-go-day]')) { ev.preventDefault(); setDate(ev.target.dataset.goDay, 'day'); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && SaveState.status === 'dirty') saveNow(); });
window.addEventListener('beforeunload', e => { if (SaveState.status === 'dirty' || SaveState.status === 'error') { saveNow(); e.preventDefault(); e.returnValue = ''; } });

/* ---------- Startup ---------- */
async function init() {
  // swap in logo.png wherever the logo is already on screen; later renders use it directly
  checkCustomLogo(() => document.querySelectorAll('svg.brand-mark').forEach(svg => {
    const img = document.createElement('img'); img.className = 'brand-mark'; img.src = 'logo.png'; img.alt = '';
    img.style.cssText = (svg.getAttribute('style') || '') + ';object-fit:contain;border-radius:6px'; svg.replaceWith(img);
  }));
  try {
    await Store.init();
    let res;
    if (!IS_ARTIFACT && FB.board && !FB.configured()) { renderLanding('fb.notConfigured'); return; }
    if (!IS_ARTIFACT && FB.configured() && (!FB.board || FB.board === 'bad')) { renderLanding(FB.board ? 'fb.badLink' : 'fb.landingMsg'); return; }
    if (IS_ARTIFACT || FB.active()) {
      document.getElementById('app').innerHTML = '<p style="padding:24px">Connecting to the shared schedule… / جارٍ الاتصال بالجدول المشترك…</p>';
      if (await Cloud.connect()) res = { state, problem: null, cloud: true };
      else if (FB.active()) { document.getElementById('app').innerHTML = `<div style="padding:30px;font-family:sans-serif"><p>${esc(t('cloud.notConnected'))}</p></div>`; return; }
    }
    if (!res) res = await loadState();
    state = res.state;
    state.settings.language = currentLanguagePref();
    await loadUI();
    if (!ui.date) { const td = todayAmman(); ui.date = (td >= state.settings.marketStart && td <= state.settings.marketEnd) ? td : state.settings.marketStart; }
    ui.monthCursor = ui.date.slice(0, 8) + '01';
    SaveState.onChange = updateSaveStatus;
    afterCommit = () => render();
    if (res.cloud) { SaveState.lastSaved = new Date(); }
    else if (res.fresh || res.problem) await saveNow(); else { SaveState.lastSaved = new Date(state.meta.updatedAt); }
    render();
    if (res.problem === 'corrupt') {
      try { corruptRaw = String(await Store.get(res.corruptKey) || ''); } catch (e) { corruptRaw = ''; }
      await alertDialog(t('err.corruptTitle'), `<p>${esc(t('err.corruptMsg'))}</p><pre class="small" style="white-space:pre-wrap">${esc(String(res.detail).slice(0, 600))}</pre><p><button type="button" class="btn" id="dl-corrupt">⇩ ${esc(t('err.downloadRaw'))}</button></p>`);
    } else if (res.problem) toast(t('err.readFailed'), { type: 'error', timeout: 12000 });
    if (Store.mode === 'memory' && !Cloud.active) toast(t('store.memoryWarn'), { type: 'error', timeout: 15000 });
    if (IS_ARTIFACT && !Cloud.active) toast(t('cloud.notConnected'), { type: 'error', timeout: 15000 });
    if (FB.active() && new URLSearchParams(location.search).get('new')) {
      history.replaceState(null, '', FB.shareLink());
      alertDialog(t('fb.createdTitle'), `<p>${esc(t('fb.createdMsg'))}</p><p><input type="text" readonly value="${esc(FB.shareLink())}" style="width:100%" dir="ltr" onfocus="this.select()"></p>`);
    }
  } catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML = `<div style="padding:30px;font-family:sans-serif"><h1>Startup error</h1><p>${esc(e.message)}</p><p>Please report this message. Your stored data has not been modified.</p></div>`;
  }
}
let corruptRaw = '';
document.addEventListener('click', ev => {
  if (ev.target.id === 'dl-corrupt') download(`amman-market-unreadable-data-${fileStamp()}.txt`, corruptRaw || 'No data', 'text/plain');
});
init();

</script>
